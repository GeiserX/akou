[package]
name = "akou-capture"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "akou's capture helper: mic and call audio as two aligned channels, an Ogg Opus file and akou-capture/1 packets"
publish = false

[features]
# Fault switches (`--simulate …`) for the app's trap tests. Never in a shipping build.
simulate = []

[dependencies]
ogg = "0.9"
opus = "0.4"
rubato = { version = "5", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18"
libc = "0.2"
objc2 = "0.6"
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
# The PulseAudio native protocol in pure Rust: PipeWire (pipewire-pulse) and PulseAudio both
# serve it, and nothing links a C audio library, so the helper starts on any Linux.
futures = { version = "0.3", default-features = false, features = ["executor"] }
libc = "0.2"
pulseaudio = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.24"
# The same `windows` release wasapi is built on, for the few calls it does not wrap.
windows = { version = "0.62", features = [
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Performance",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# The tests push minutes of audio through the resampler; unoptimised they take minutes.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
