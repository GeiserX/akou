[package]
name = "akou-capture"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "akou's capture helper: mic and call audio as two aligned channels, an Ogg Opus file and akou-capture/1 packets"
publish = false

[features]
# Fault switches (`--simulate …`) for the app's trap tests. Never in a shipping build.
simulate = []

[dependencies]
ogg = "0.9"
opus = "0.4"
rubato = { version = "5", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18"
libc = "0.2"
objc2 = "0.6"
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
# Dictation (DC-N1, DC-N8, DC-N9, DC-L2): the accessibility reads (AXUIElement, AXIsProcessTrusted)
# and the key tap (CGEventTap). Generated from Apple's headers by the objc2 project, like the Core
# Audio bindings above; handy-keys, the tap DICTATION.md names, is built on the same crate.
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "libc", "HIServices", "AXError", "AXUIElement", "AXValue"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "libc", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "CGWindow"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The PulseAudio native protocol in pure Rust: PipeWire (pipewire-pulse) and PulseAudio both
# serve it, and nothing links a C audio library, so the helper starts on any Linux.
futures = { version = "0.3", default-features = false, features = ["executor"] }
libc = "0.2"
pulseaudio = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.24"
# The same `windows` release wasapi is built on, for the few calls it does not wrap. Dictation
# (DC-N1, DC-N6 to DC-N9, DC-L2) adds the low-level key and mouse hooks and `SendInput`
# (UI_WindowsAndMessaging, UI_Input_KeyboardAndMouse, and Graphics_Gdi for a window class), the clipboard's delayed rendering
# (System_DataExchange, System_Memory), UI Automation for the focused field (UI_Accessibility,
# System_Com, System_Ole, System_Variant), the target's integrity level (Security), the unlock
# notice that reinstalls the hook (System_RemoteDesktop) and the microphone privacy switch
# (System_Registry). These are the calls handy-keys and enigo make on Windows, taken directly so
# the hook can decide per event what DC-A4 swallows and every posted event carries akou's mark.
windows = { version = "0.62", features = [
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Performance",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# The macOS pasteboard and layout checks run on the main thread, where AppKit serves a pasteboard
# promise; the default harness runs tests on other threads, so this one is its own `main`.
[[test]]
name = "mac_pasteboard"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# The tests push minutes of audio through the resampler; unoptimised they take minutes.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
