<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' views:; style-src 'self' views:; connect-src 'self' views: ws://127.0.0.1:*; img-src 'self' views: data:; base-uri 'none'; form-action 'none'">
<title>akou draft</title>
<link rel="stylesheet" href="draft.css">
<script type="module" src="index.js"></script>
</head>
<body class="draft-page">
<main id="draft" aria-label="Draft" hidden>
  <div id="draft-island" class="electrobun-webkit-app-region-drag">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.8h5.2L12.5 5v8.2a1 1 0 0 1-1 1h-7.5a1 1 0 0 1-1-1V2.8a1 1 0 0 1 1-1z" fill="none" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/><path d="M5.6 8.2h4.8M5.6 10.8h3.2" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/></svg>
    <span>Draft<span id="draft-length" class="dim"></span></span>
  </div>
  <section id="draft-sheet">
    <header id="draft-head" class="electrobun-webkit-app-region-drag">
      <span id="draft-title">Draft<span class="dim">Not sent yet. Edit freely.</span></span>
      <span id="draft-to" hidden><span class="dim">Goes to</span><span id="draft-app-icon" aria-hidden="true"></span><b id="draft-app"></b></span>
    </header>
    <div id="draft-body">
    <div id="draft-field">
      <div id="draft-marks" aria-hidden="true"></div>
      <textarea id="draft-text" aria-label="Dictated text" rows="4"></textarea>
    </div>
    <p id="draft-meta"></p>
    <p id="draft-noconf" class="hint" hidden>no confidence from this engine</p>
    <div id="draft-alts" role="menu" aria-label="Other readings" hidden></div>
    <fieldset id="chip" aria-label="Learn a word" hidden></fieldset>
    </div>
    <footer id="draft-foot">
      <button id="draft-close" class="plain" type="button" title="Discard (Esc)">Discard <kbd>esc</kbd></button>
      <span id="draft-retry-group">
        <button id="draft-retry" type="button"></button>
        <span id="draft-retry-pick"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 3.8 5 6.3l2.5-2.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><select id="draft-retry-engine" aria-label="Engine to retry with"></select></span>
      </span>
      <span class="spring"></span>
      <button id="draft-copy" type="button">Copy</button>
      <button id="draft-insert" type="button" title="Insert (Enter)">Insert</button>
      <button id="draft-send" class="pri" type="button">Send <kbd id="draft-send-key"></kbd></button>
    </footer>
  </section>
</main>
</body>
</html>
