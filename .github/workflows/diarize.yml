name: diarize

# The diarization helper (native/akou-diarize) on every OS: format, lint, unit tests and the NOTICE
# check, the release build, then the real Nemotron model through it in both modes, over a
# generated two-voice conversation it must tell apart. That last step is the one that says the
# statically linked ONNX Runtime loads and infers on Windows, which no other job covers. The model is fetched here from its pinned URL, checked against its
# pinned SHA-256 and cached by it; akou's own downloader stays off in CI.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "native/akou-diarize/**"
      - "src/main/asr/nemotron.ts"
      - "src/main/asr/models.ts"
      - "scripts/diarize-smoke.ts"
      - "tests/fixtures/two-voices.*"
      - ".github/workflows/diarize.yml"
      - "NOTICE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helper:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      EXE: ${{ matrix.os == 'windows-latest' && '.exe' || '' }}
      MODEL_URL: https://huggingface.co/altunenes/parakeet-rs/resolve/4d2a8bc71f5c896ec40faa59732e6716295edaf2/nemotron-3-diarization/nemotron3_diar_v3.onnx
      MODEL_SHA256: 915e4fa23b0192ed9fadeb1cdd26847df986d50c92012d177be28d0343bbe03a
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
      - name: cargo fmt --check
        working-directory: native/akou-diarize
        run: cargo fmt --check
      - name: cargo clippy -D warnings
        working-directory: native/akou-diarize
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test (unit and NOTICE)
        working-directory: native/akou-diarize
        run: cargo test --locked
      - name: cargo build --release
        working-directory: native/akou-diarize
        run: |
          cargo build --locked --release
          bin="target/release/akou-diarize$EXE"
          "$bin" --version
          echo "### akou-diarize on ${{ runner.os }}: $(wc -c < "$bin") bytes" >> "$GITHUB_STEP_SUMMARY"
      - name: the model, by its pinned SHA-256
        id: model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models/nemotron3_diar_v3.onnx
          key: nemotron3-diar-${{ env.MODEL_SHA256 }}
      - name: fetch and check the model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fsSL --retry 3 -o models/nemotron3_diar_v3.onnx "$MODEL_URL"
      - name: the model matches its pin
        run: |
          got=$( (sha256sum models/nemotron3_diar_v3.onnx 2>/dev/null || shasum -a 256 models/nemotron3_diar_v3.onnx) | cut -d' ' -f1)
          echo "sha256 $got"
          test "$got" = "$MODEL_SHA256"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: two voices through the real model, final and live
        run: |
          bun scripts/diarize-smoke.ts "native/akou-diarize/target/release/akou-diarize$EXE" models/nemotron3_diar_v3.onnx | tee smoke.log
          { echo; sed 's/^/    /' smoke.log; } >> "$GITHUB_STEP_SUMMARY"
