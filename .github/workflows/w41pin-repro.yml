name: w41pin-repro (temporary)
on:
  push:
    branches: [fix/w41pin-flake]
permissions:
  contents: read
jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AKOU_UI_BROWSER: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: printf 'Acquire::http::Timeout "10";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99akou-ci-retries
      - run: bunx playwright-core install --with-deps webkit
      - run: |
          set +e
          bun test --path-ignore-patterns='nothing/**' --timeout 60000 ./tests/ui/parity.test.ts -t "The live transcript sits at the bottom" --rerun-each 60 > out.log 2>&1
          echo "exit $?"
          grep -E "W41DIAG|^error:" out.log | cut -c1-20000
          echo "pass $(grep -c '^(pass)' out.log) fail $(grep -c '^(fail)' out.log)"
