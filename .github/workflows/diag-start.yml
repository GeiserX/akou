name: diag-start
# Temporary (issue #491): which part of a call start's folder stage is slow on a fresh Windows runner.
on:
  pull_request:
permissions:
  contents: read
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - shell: bash
        run: |
          bun scripts/ci/diag-start.ts "$RUNNER_TEMP" D-first
          bun scripts/ci/diag-start.ts "$USERPROFILE/AppData/Local/Temp" C-first
          bun scripts/ci/diag-start.ts "$RUNNER_TEMP" D-again
          bun scripts/ci/diag-start.ts "$USERPROFILE/AppData/Local/Temp" C-again
