name: models

# Downloads the pinned recognizer and transcribes one clip with it on each OS, through the app's own
# code (scripts/models-smoke.ts). `check` never downloads a model, so this is what proves a new pin
# loads in sherpa-onnx-node on Linux, Windows and macOS. About 2.6 GB per runner, so it runs only
# when the pins or the code that loads them change.

on:
  push:
    branches: [main]
    paths:
      - src/main/asr/models.ts
      - src/main/asr/sherpa.ts
      - scripts/models-smoke.ts
      - bun.lock
      - .github/workflows/models.yml
  pull_request:
    paths:
      - src/main/asr/models.ts
      - src/main/asr/sherpa.ts
      - scripts/models-smoke.ts
      - bun.lock
      - .github/workflows/models.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun scripts/models-smoke.ts "${{ runner.temp }}/models"
