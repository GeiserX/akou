name: ui

# The window in a headless browser (docs/DESIGN.md sections 7 and 9): Playwright drives the real
# page over the real headless app with the fake capture helper, the fake recognizer and a fake
# provider. Only Chromium's headless shell is installed; nothing plays audio or opens a window.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The browser build pinned by playwright-core, headless shell only, with its system libraries.
      - run: bunx playwright-core install --with-deps --only-shell chromium
      - run: bun run test:ui
