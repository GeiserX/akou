name: ci

# Every pull request and every push to main (docs/CI-CD.md section 2.1): the checks, the window in
# a headless browser, and the capture helper on every OS. One job, `ci-ok`, is the required check.
# It fails when any leg failed or was cancelled and passes when a leg was skipped on purpose, which
# is how a docs-only pull request skips the heavy legs without leaving a required check pending.
#
# Every test job ends with its floor (scripts/ci/test-floor.ts, tests/floors.json): fewer passes
# or more skips than the floor fail the job. Bun is the version in .bun-version, everywhere.
#
# Run by hand with `repeat` to prove a flake fix: the ui and capture legs run every test that many
# times (`--rerun-each`) in one dispatch, the check leg runs the capture traps against the fake
# helper that many times after the one full check, and every floor scales with it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      repeat:
        description: "Run every ui and capture test, and check's capture traps, this many times (--rerun-each)"
        type: number
        default: 1

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What a pull request needs. `code` is false only when every changed file is documentation
  # (under docs/, the issue tracker's export under .beads/, or a Markdown file at the top); then
  # only the Linux `check` leg runs, because some tests read the docs. `diarize` is true when the
  # diarization helper, its client, its smoke or their fixtures changed; that leg downloads a model
  # on three OSes, so it runs only then. `gpu` is true when the image, the llama-server builds or the
  # accelerator choice changed; that leg downloads the CUDA runtime (about 750 MB) twice, so it too
  # runs only then. A push to main and a dispatch run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      diarize: ${{ steps.diff.outputs.diarize }}
      gpu: ${{ steps.diff.outputs.gpu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's merge commit and its first parent, the base branch.
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "diarize=true" >> "$GITHUB_OUTPUT"
            echo "gpu=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD > changed.txt
          cat changed.txt
          if grep -qvE '^(docs/|\.beads/|[^/]+\.md$)' changed.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^(native/akou-diarize/|src/main/asr/(nemotron|models)\.ts$|scripts/diarize-smoke\.ts$|tests/fixtures/two-voices\.|\.github/workflows/ci\.yml$|NOTICE$)' changed.txt; then
            echo "diarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "diarize=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^(Dockerfile$|\.dockerignore$|src/main/asr/(accelerator|llama-builds|llama-catalog|models)\.ts$|scripts/accelerator-report\.ts$|\.github/workflows/(ci|release)\.yml$)' changed.txt; then
            echo "gpu=true" >> "$GITHUB_OUTPUT"
          else
            echo "gpu=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.code == 'true' && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.repeat > 1 && 180 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The pinned Bun, Biome, tsc twice, bun test, then the job's floor.
      - run: bun run check
      # A dispatch with `repeat` proves the flake fixes that live in the check: the capture traps
      # against the fake helper (the helper crash and [T0.9], docs/TESTING.md TS-1), that many times.
      # bash on every OS: Windows' default shell, pwsh, reads "$TEST_REPEAT" as an unset
      # PowerShell variable.
      - if: inputs.repeat > 1
        shell: bash
        env:
          TEST_REPEAT: ${{ inputs.repeat }}
        run: |
          bun test --rerun-each "$TEST_REPEAT" --reporter=junit --reporter-outfile=.junit-traps.xml tests/capture-traps.test.ts
          bun scripts/ci/test-floor.ts capture-traps .junit-traps.xml

  # The window in a headless browser (docs/DESIGN.md sections 7 and 9): Playwright drives the real
  # page over the real headless app with the fake capture helper, the fake recognizer and a fake
  # provider. Only Chromium's headless shell is installed; nothing plays audio or opens a window.
  ui:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.repeat > 1 && 180 || 20 }}
    env:
      TEST_REPEAT: ${{ inputs.repeat || 1 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The browser build pinned by playwright-core, headless shell only, with its system libraries.
      - run: bunx playwright-core install --with-deps --only-shell chromium
      - run: bun run test:ui --rerun-each "$TEST_REPEAT" --reporter=junit --reporter-outfile=.junit-ui.xml
      - run: bun scripts/ci/test-floor.ts ui .junit-ui.xml

  # The capture helper (native/akou-capture) on every OS: format, lint, unit and engine tests, both
  # release builds, then the app's capture trap scenarios against the real binary in file mode.
  # Nothing here opens an audio device: the e2e runs the helper with --from-wav and
  # AKOU_CAPTURE_FILE_ONLY=1. Device capture runs on hardware in the release checklist.
  helper:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.repeat > 1 && 90 || 30 }}
    env:
      CARGO_TERM_COLOR: always
      EXE: ${{ matrix.os == 'windows-latest' && '.exe' || '' }}
      TEST_REPEAT: ${{ inputs.repeat || 1 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
          cargo --version
      - name: cargo fmt --check
        working-directory: native/akou-capture
        run: cargo fmt --check
      - name: cargo clippy -D warnings (shipping and test builds)
        working-directory: native/akou-capture
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features simulate -- -D warnings
      # The MPRIS tests (DC-U8) start their own private bus with the reference daemon.
      - name: dbus-daemon for the MPRIS tests (Linux)
        if: runner.os == 'Linux'
        run: |
          command -v dbus-daemon || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends dbus; }
          dbus-daemon --version | head -1
      - name: cargo test (shipping and test builds)
        working-directory: native/akou-capture
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee ../../.cargo-test.log
          cargo test --locked --features simulate 2>&1 | tee -a ../../.cargo-test.log
      - name: cargo build --release
        working-directory: native/akou-capture
        run: |
          cargo build --locked --release
          mkdir -p target/shipping
          cp "target/release/akou-capture$EXE" "target/shipping/akou-capture$EXE"
          cargo build --locked --release --features simulate
          {
            echo "### akou-capture on ${{ runner.os }}"
            echo
            echo "| build | bytes |"
            echo "|---|---|"
            echo "| shipping | $(wc -c < "target/shipping/akou-capture$EXE") |"
            echo "| test (simulate) | $(wc -c < "target/release/akou-capture$EXE") |"
          } >> "$GITHUB_STEP_SUMMARY"
      # DC-N10: `dictate`'s fakes (a scripted key source, a fake inserter, clipboard and
      # accessibility tree) exist only in the simulate build. The shipping binary must refuse each
      # one as a usage error that names the missing feature; the simulate binary, the positive
      # control, must not.
      - name: the shipping helper refuses every dictate fake
        working-directory: native/akou-capture
        run: |
          for s in --from-wav --keys --inserter --clipboard --ax --speed --mic-open-delay --mic-bluetooth --ring-ms; do
            set +e
            "target/shipping/akou-capture$EXE" dictate "$s" fake x 2> refused.err
            code=$?
            set -e
            if [ "$code" != 64 ] || ! grep -q 'no simulate switches' refused.err; then
              echo "the shipping helper took dictate $s (exit $code):"
              cat refused.err
              exit 1
            fi
          done
          set +e
          "target/release/akou-capture$EXE" dictate --inserter fake 2> control.err
          set -e
          if grep -q 'no simulate switches' control.err; then
            echo "the simulate build refused --inserter fake; the check above proves nothing"
            cat control.err
            exit 1
          fi
      # DC-N1: every OS builds `dictate` and names its backend without a tap or a device. `--probe`
      # prints the `ready` line the process would send, with the grants read without asking.
      - name: dictate names its backend
        working-directory: native/akou-capture
        run: |
          case "$RUNNER_OS" in
            macOS) want='"backend":"cgeventtap","swallow_keys":true' ;;
            Windows) want='"backend":"llhook","swallow_keys":true' ;;
            *) want='"backend":"evdev","swallow_keys":false' ;;
          esac
          "target/shipping/akou-capture$EXE" dictate --probe 2> probe.err
          cat probe.err
          grep -q '"type":"ready","protocol":"akou-dictate/1"' probe.err
          grep -qF "$want" probe.err || { echo "expected $want"; exit 1; }
          { echo; echo "dictate --probe: \`$(cat probe.err)\`"; } >> "$GITHUB_STEP_SUMMARY"
      # DC-N1 on a real macOS event tap. This runner trusts the processes it starts for
      # Accessibility (docs/gates/dc-k1-accessibility-grant.md), so the shipping helper's tap is
      # created here, which a test on a developer's Mac must never do. A small program posts
      # Control+Shift+Space, the dictation key here, then A, and a second tap at the tail of the
      # session records what got past the helper: Space must not, A and the modifiers must. The
      # same posts with no helper running must show Space, or the check proves nothing.
      - name: the real key tap swallows the dictation key and passes the rest (macOS)
        if: runner.os == 'macOS'
        working-directory: native/akou-capture
        run: |
          cat > post-keys.swift <<'EOF'
          import CoreGraphics
          import Foundation
          var seen: [String] = []
          let mask = (1 << CGEventType.keyDown.rawValue) | (1 << CGEventType.keyUp.rawValue)
            | (1 << CGEventType.flagsChanged.rawValue)
          let callback: CGEventTapCallBack = { _, type, event, _ in
            let code = event.getIntegerValueField(.keyboardEventKeycode)
            let kind = type == .keyDown ? "down" : type == .keyUp ? "up" : "flags"
            seen.append("\(kind):\(code)")
            return Unmanaged.passUnretained(event)
          }
          guard let tap = CGEvent.tapCreate(tap: .cgSessionEventTap, place: .tailAppendEventTap,
            options: .defaultTap, eventsOfInterest: CGEventMask(mask), callback: callback, userInfo: nil)
          else { print("no tap"); exit(2) }
          CFRunLoopAddSource(CFRunLoopGetCurrent(), CFMachPortCreateRunLoopSource(nil, tap, 0), .commonModes)
          CGEvent.tapEnable(tap: tap, enable: true)
          let source = CGEventSource(stateID: .hidSystemState)
          func pump(_ s: Double) { CFRunLoopRunInMode(.defaultMode, s, false) }
          func post(_ code: CGKeyCode, _ down: Bool, _ flags: UInt64, modifier: Bool = false) {
            let e = CGEvent(keyboardEventSource: source, virtualKey: code, keyDown: down)!
            if modifier { e.type = .flagsChanged }
            e.flags = CGEventFlags(rawValue: flags)
            e.post(tap: .cghidEventTap)
            pump(0.05)
          }
          let ctl: UInt64 = 0x40000 | 0x1, sh: UInt64 = 0x20000 | 0x2
          post(59, true, ctl, modifier: true)
          post(56, true, ctl | sh, modifier: true)
          post(49, true, ctl | sh)
          post(49, false, ctl | sh)
          post(56, false, ctl, modifier: true)
          post(59, false, 0, modifier: true)
          post(0, true, 0)
          post(0, false, 0)
          pump(0.3)
          print(seen.joined(separator: " "))
          EOF
          swiftc -O -o post-keys post-keys.swift
          ./post-keys | tee control.txt
          grep -qw 'down:49' control.txt || { echo "with no helper Space must get through"; exit 1; }
          mkfifo helper.in
          "target/shipping/akou-capture" dictate --hotkey Control+Shift+Space --warm off < helper.in > helper.out 2> helper.err &
          helper=$!
          exec 3> helper.in
          for _ in $(seq 1 100); do grep -q '"type":"ready"' helper.err && break; sleep 0.1; done
          cat helper.err
          grep -q '"accessibility":"granted"' helper.err
          if grep -q no-tap helper.err; then echo "the helper made no tap"; exit 1; fi
          ./post-keys | tee tapped.txt
          echo '{"type":"stop"}' >&3
          exec 3>&-
          wait "$helper"
          cat helper.err
          grep -q '"type":"stopped"' helper.err
          grep -q '"type":"mic","open":true' helper.err || { echo "the press never reached the session"; exit 1; }
          # DC-N5: a session on a real device says which input it chose, from Core Audio's list.
          grep -q '"type":"session.started"' helper.err || { echo "no session started"; exit 1; }
          grep '"type":"session.started"' helper.err | grep -q '"mic":{"transport":' || { echo "session.started names no mic"; exit 1; }
          echo "audio packets: $(wc -c < helper.out) bytes"
          for k in flags:59 flags:56 down:0 up:0; do
            grep -qw "$k" tapped.txt || { echo "$k was swallowed"; exit 1; }
          done
          if grep -qwE 'down:49|up:49' tapped.txt; then echo "the dictation key reached the app"; exit 1; fi
      # DC-N6, DC-N7, DC-N9 on a real Mac: the shipping helper pastes into a real text view and
      # types into it, on this runner only (it changes the clipboard and posts keys). A throwaway
      # AppKit window holds the field, with an Edit menu so Command+V pastes, and writes its text
      # to a file. The helper brings it to the
      # front (`focus`), pastes with Enter as the send key, then types; the field must hold both
      # and the clipboard must hold what it held before. The field starts empty and the clipboard
      # starts with other text, so neither check can pass without the insert and the restore.
      - name: the real inserter pastes, types and restores the clipboard (macOS)
        if: runner.os == 'macOS'
        working-directory: native/akou-capture
        run: |
          cat > target-app.swift <<'EOF'
          import AppKit
          let app = NSApplication.shared
          app.setActivationPolicy(.regular)
          // Command+V reaches a text view through the menu's key equivalent, as in any app.
          let bar = NSMenu(), edit = NSMenu(title: "Edit"), item = NSMenuItem()
          item.submenu = edit
          bar.addItem(item)
          edit.addItem(withTitle: "Paste", action: #selector(NSText.paste(_:)), keyEquivalent: "v")
          app.mainMenu = bar
          let win = NSWindow(contentRect: NSRect(x: 200, y: 200, width: 480, height: 240),
            styleMask: [.titled], backing: .buffered, defer: false)
          let view = NSTextView(frame: win.contentView!.bounds)
          win.contentView!.addSubview(view)
          win.makeKeyAndOrderFront(nil)
          win.makeFirstResponder(view)
          app.activate(ignoringOtherApps: true)
          let me = NSRunningApplication.current.bundleIdentifier ?? ""
          print("\(getpid()) \(win.windowNumber) \(me)")
          fflush(stdout)
          Timer.scheduledTimer(withTimeInterval: 0.1, repeats: true) { _ in
            try? view.string.write(toFile: "field.txt", atomically: true, encoding: .utf8)
          }
          app.run()
          EOF
          swiftc -O -o target-app target-app.swift
          printf 'copied before akou' | pbcopy
          [ "$(pbpaste)" = 'copied before akou' ] || { echo "pbcopy did not take"; exit 1; }
          ./target-app > target.out 2> target.err &
          app=$!
          for _ in $(seq 1 100); do [ -s target.out ] && [ -f field.txt ] && break; sleep 0.1; done
          read -r pid win bundle < target.out
          [ -z "$(cat field.txt)" ] || { echo "the field was not empty"; exit 1; }
          target="{\"app\":\"$bundle\",\"pid\":$pid,\"window\":\"$win\",\"field\":\"editable\"}"
          mkfifo insert.in
          "target/shipping/akou-capture" dictate --warm off < insert.in > insert.out 2> insert.err &
          helper=$!
          exec 4> insert.in
          for _ in $(seq 1 100); do grep -q '"type":"ready"' insert.err && break; sleep 0.1; done
          answer() {
            for _ in $(seq 1 150); do grep -q "\"id\":\"$1\"" insert.err && return 0; sleep 0.1; done
            echo "no answer to insert $1"; cat insert.err; exit 1
          }
          echo "{\"type\":\"focus\",\"target\":$target}" >&4
          echo "{\"type\":\"insert\",\"id\":\"p1\",\"text\":\"pasted by akou\",\"method\":\"paste\",\"send_key\":\"Enter\",\"target\":$target}" >&4
          answer p1
          echo "{\"type\":\"insert\",\"id\":\"t1\",\"text\":\"typed é 😀\",\"method\":\"type\",\"send_key\":\"none\",\"target\":$target}" >&4
          answer t1
          sleep 0.5
          echo '{"type":"stop"}' >&4
          exec 4>&-
          wait "$helper"
          kill "$app" || true
          cat insert.err
          field=$(cat field.txt)
          echo "field: $field"
          echo "clipboard: $(pbpaste)"
          grep -q '"type":"inserted","id":"p1","method":"paste"' insert.err || { echo "the paste was not read"; exit 1; }
          grep -q '"type":"inserted","id":"t1","method":"type"' insert.err || { echo "the typing failed"; exit 1; }
          [ "$field" = "$(printf 'pasted by akou\ntyped é 😀')" ] || { echo "the field holds the wrong text"; exit 1; }
          [ "$(pbpaste)" = 'copied before akou' ] || { echo "the clipboard was not restored: $(pbpaste)"; exit 1; }
      # DC-N2 on a real Mac: bound to Fn, the shipping helper sets the Globe key's action to Do
      # Nothing and gives the runner's value back on stop; killed while it owns the key, the next
      # start gives it back. The runner starts from a value that is not Do Nothing, and the kill is
      # checked to leave Do Nothing behind, so neither check can pass without the write and the
      # repair. This changes a user preference: on this runner only, never in `cargo test`.
      - name: Fn as the key silences the Globe action and gives it back (macOS)
        if: runner.os == 'macOS'
        working-directory: native/akou-capture
        run: |
          defaults write com.apple.HIToolbox AppleFnUsageType -int 2
          usage() { defaults read com.apple.HIToolbox AppleFnUsageType 2>/dev/null || echo unset; }
          start() {
            rm -f globe.in
            mkfifo globe.in
            "target/shipping/akou-capture" dictate --hotkey "$1" --warm off < globe.in > /dev/null 2> globe.err &
            helper=$!
            exec 5> globe.in
            for _ in $(seq 1 100); do grep -q '"type":"ready"' globe.err && break; sleep 0.1; done
            grep -q '"type":"ready"' globe.err || { echo "the helper never got ready"; cat globe.err; exit 1; }
          }
          stop() {
            echo '{"type":"stop"}' >&5
            exec 5>&-
            wait "$helper"
          }
          start Fn
          [ "$(usage)" = 0 ] || { echo "bound to Fn, the Globe action is $(usage)"; exit 1; }
          stop
          [ "$(usage)" = 2 ] || { echo "after stop the Globe action is $(usage), not 2"; exit 1; }
          start Fn
          kill -9 "$helper"
          exec 5>&-
          wait "$helper" || true
          [ "$(usage)" = 0 ] || { echo "the killed helper left $(usage), so the repair proves nothing"; exit 1; }
          start RightCommand
          [ "$(usage)" = 2 ] || { echo "the next start did not repair the crash: $(usage)"; exit 1; }
          stop
          if defaults read io.github.geiserx.akou.dictate globeSavedFnUsageType 2>/dev/null; then
            echo "akou's saved copy was left behind"; exit 1
          fi
      # DC-N1, DC-A4 and DC-N6 to DC-N9 on a real Windows desktop, on this runner only (it hooks
      # the keyboard, posts keys and changes the clipboard). A small program installs its own
      # low-level keyboard hook first, so the helper's hook, installed after it, runs before it:
      # what the program records is what got past the helper. It posts Control+Shift+Space, the
      # dictation key here, then A: Space must not get past, A and the modifiers must, and the
      # same posts with no helper running must show Space, or the check proves nothing. Then a
      # throwaway window with a text box: the helper brings it to the front (`focus`), pastes
      # with Enter as the send key, then types; the box must hold both and the clipboard must hold
      # what it held before. Last, a lone Right Win bound to dictation must reach the program as
      # Right Win down, the mask key 0xE8 down and up, then Right Win up, so no Start menu opens;
      # with no helper there is no mask key. Windows PowerShell reads this script as ANSI, so
      # non-ASCII text is built from code points and sent as JSON escapes.
      - name: the real hook, paste and mask key on a Windows desktop (Windows)
        if: runner.os == 'Windows'
        working-directory: native/akou-capture
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -ReferencedAssemblies System.Windows.Forms, System.Drawing -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Diagnostics;
          using System.Runtime.InteropServices;
          using System.Threading;
          using System.Windows.Forms;

          public static class Probe {
              delegate IntPtr HookProc(int code, IntPtr wp, IntPtr lp);
              [DllImport("user32.dll")] static extern IntPtr SetWindowsHookEx(int id, HookProc fn, IntPtr mod, uint tid);
              [DllImport("user32.dll")] static extern IntPtr CallNextHookEx(IntPtr h, int code, IntPtr wp, IntPtr lp);
              [DllImport("kernel32.dll")] static extern IntPtr GetModuleHandle(string name);
              [DllImport("user32.dll")] static extern uint SendInput(uint n, INPUT[] inputs, int size);
              [DllImport("user32.dll")] static extern IntPtr GetForegroundWindow();
              [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
              [DllImport("user32.dll")] static extern bool SetForegroundWindow(IntPtr h);
              [DllImport("user32.dll")] static extern bool BringWindowToTop(IntPtr h);
              [DllImport("user32.dll")] static extern bool AttachThreadInput(uint a, uint b, bool attach);
              [DllImport("kernel32.dll")] static extern uint GetCurrentThreadId();
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode)]
              static extern bool QueryFullProcessImageName(IntPtr h, int flags, System.Text.StringBuilder name, ref int size);
              [StructLayout(LayoutKind.Sequential)]
              struct KEYBDINPUT { public ushort wVk; public ushort wScan; public uint dwFlags; public uint time; public IntPtr dwExtraInfo; }
              [StructLayout(LayoutKind.Explicit, Size = 40)]
              struct INPUT { [FieldOffset(0)] public uint type; [FieldOffset(8)] public KEYBDINPUT ki; }
              [StructLayout(LayoutKind.Sequential)]
              struct MOUSEINPUT { public int dx; public int dy; public uint mouseData; public uint dwFlags; public uint time; public IntPtr dwExtraInfo; }
              [StructLayout(LayoutKind.Explicit, Size = 40)]
              struct MINPUT { [FieldOffset(0)] public uint type; [FieldOffset(8)] public MOUSEINPUT mi; }
              [DllImport("user32.dll", EntryPoint = "SendInput")] static extern uint SendMouse(uint n, MINPUT[] inputs, int size);

              static HookProc keep;
              static List<string> seen = new List<string>();

              static IntPtr Record(int code, IntPtr wp, IntPtr lp) {
                  if (code >= 0) {
                      int vk = Marshal.ReadInt32(lp);
                      int msg = wp.ToInt32();
                      lock (seen) seen.Add(((msg == 0x100 || msg == 0x104) ? "down:" : "up:") + vk.ToString("X2"));
                  }
                  return CallNextHookEx(IntPtr.Zero, code, wp, lp);
              }

              public static void Hook() {
                  keep = Record;
                  if (SetWindowsHookEx(13, keep, GetModuleHandle(null), 0) == IntPtr.Zero) throw new Exception("no recorder hook");
              }

              // The side buttons (WM_XBUTTONDOWN/UP) as "xdown:1", the button in the high word of
              // MSLLHOOKSTRUCT.mouseData.
              static HookProc keepMouse;
              static IntPtr RecordMouse(int code, IntPtr wp, IntPtr lp) {
                  int msg = wp.ToInt32();
                  if (code >= 0 && (msg == 0x20B || msg == 0x20C)) {
                      int button = (Marshal.ReadInt32(lp, 8) >> 16) & 0xFFFF;
                      lock (seen) seen.Add((msg == 0x20B ? "xdown:" : "xup:") + button);
                  }
                  return CallNextHookEx(IntPtr.Zero, code, wp, lp);
              }

              public static void HookMouse() {
                  keepMouse = RecordMouse;
                  if (SetWindowsHookEx(14, keepMouse, GetModuleHandle(null), 0) == IntPtr.Zero) throw new Exception("no mouse recorder hook");
              }

              // "d:1 u:1": side button 1 (XBUTTON1, Mouse4) down and up, 40 ms apart, like Play.
              public static string PlayMouse(string buttons) {
                  lock (seen) seen.Clear();
                  string failed = null;
                  Thread t = new Thread(() => {
                      foreach (string b in buttons.Split(' ')) {
                          MINPUT[] input = new MINPUT[1];
                          input[0].type = 0;
                          input[0].mi.mouseData = Convert.ToUInt32(b.Substring(2));
                          input[0].mi.dwFlags = b[0] == 'd' ? 0x80u : 0x100u;
                          if (SendMouse(1, input, Marshal.SizeOf(typeof(MINPUT))) != 1) failed = b;
                          Thread.Sleep(40);
                      }
                  });
                  t.Start();
                  while (t.IsAlive) Pump(20);
                  Pump(300);
                  if (failed != null) throw new Exception("SendInput refused " + failed);
                  lock (seen) return string.Join(" ", seen.ToArray());
              }

              // "<window> pid <pid>" of the window in front, the way the helper's target names it.
              public static string Front() {
                  uint pid;
                  IntPtr h = GetForegroundWindow();
                  GetWindowThreadProcessId(h, out pid);
                  return h.ToInt64() + " pid " + pid;
              }

              // This process's executable named the way the helper names a target's app, from the
              // image name; the module name .NET reports can differ from it.
              public static string Exe() {
                  System.Text.StringBuilder name = new System.Text.StringBuilder(1024);
                  int size = name.Capacity;
                  if (!QueryFullProcessImageName(Process.GetCurrentProcess().Handle, 0, name, ref size)) throw new Exception("no image name");
                  string path = name.ToString(0, size);
                  return path.Substring(path.LastIndexOfAny(new char[] { '\\', '/' }) + 1);
              }

              // Puts a window in front the way a user's click would, sharing input with the thread
              // in front so the foreground lock lets it through.
              public static void Raise(IntPtr h) {
                  uint pid;
                  uint front = GetWindowThreadProcessId(GetForegroundWindow(), out pid);
                  uint me = GetCurrentThreadId();
                  bool joined = front != 0 && front != me && AttachThreadInput(me, front, true);
                  BringWindowToTop(h);
                  SetForegroundWindow(h);
                  if (joined) AttachThreadInput(me, front, false);
                  Pump(200);
              }

              public static void Pump(int ms) {
                  DateTime until = DateTime.UtcNow.AddMilliseconds(ms);
                  while (DateTime.UtcNow < until) { Application.DoEvents(); Thread.Sleep(5); }
              }

              // "d:A2 u:A2": virtual keys down and up, posted 40 ms apart from another thread
              // while this one pumps the recorder hook.
              public static string Play(string keys) {
                  lock (seen) seen.Clear();
                  string failed = null;
                  Thread t = new Thread(() => {
                      foreach (string k in keys.Split(' ')) {
                          ushort vk = Convert.ToUInt16(k.Substring(2), 16);
                          INPUT[] input = new INPUT[1];
                          input[0].type = 1;
                          input[0].ki.wVk = vk;
                          input[0].ki.dwFlags = (uint)((k[0] == 'u' ? 2 : 0) | (vk == 0x5B || vk == 0x5C ? 1 : 0));
                          if (SendInput(1, input, Marshal.SizeOf(typeof(INPUT))) != 1) failed = k;
                          Thread.Sleep(40);
                      }
                  });
                  t.Start();
                  while (t.IsAlive) Pump(20);
                  Pump(300);
                  if (failed != null) throw new Exception("SendInput refused " + failed);
                  lock (seen) return string.Join(" ", seen.ToArray());
              }

              public class Helper {
                  Process p;
                  List<string> lines = new List<string>();
                  public Helper(string exe, string args) {
                      ProcessStartInfo psi = new ProcessStartInfo(exe, args);
                      psi.UseShellExecute = false;
                      psi.CreateNoWindow = true;
                      psi.RedirectStandardInput = true;
                      psi.RedirectStandardError = true;
                      psi.RedirectStandardOutput = true;
                      p = Process.Start(psi);
                      p.ErrorDataReceived += (s, e) => { if (e.Data != null) lock (lines) lines.Add(e.Data); };
                      p.OutputDataReceived += (s, e) => { };
                      p.BeginErrorReadLine();
                      p.BeginOutputReadLine();
                  }
                  public bool Wait(string needle, int ms) {
                      DateTime until = DateTime.UtcNow.AddMilliseconds(ms);
                      while (DateTime.UtcNow < until) {
                          lock (lines) foreach (string l in lines) if (l.Contains(needle)) return true;
                          Pump(50);
                      }
                      return false;
                  }
                  // A helper that already exited has closed its stdin: its log says why.
                  public void Send(string line) {
                      try { p.StandardInput.WriteLine(line); p.StandardInput.Flush(); } catch (Exception) { }
                  }
                  public string Stop() {
                      Send("{\"type\":\"stop\"}");
                      try { p.StandardInput.Close(); } catch (Exception) { }
                      if (!p.WaitForExit(10000)) p.Kill();
                      p.WaitForExit();
                      lock (lines) return string.Join("\n", lines.ToArray()) + "\nexit " + p.ExitCode;
                  }
              }

              public class Target {
                  public IntPtr Hwnd;
                  Form f;
                  TextBox box;
                  public Target() {
                      ManualResetEvent ready = new ManualResetEvent(false);
                      Thread t = new Thread(() => {
                          f = new Form();
                          f.Text = "akou target";
                          f.Width = 480;
                          f.Height = 240;
                          box = new TextBox();
                          box.Multiline = true;
                          box.AcceptsReturn = true;
                          box.Dock = DockStyle.Fill;
                          f.Controls.Add(box);
                          f.Shown += (s, e) => { f.Activate(); box.Focus(); Hwnd = f.Handle; ready.Set(); };
                          Application.Run(f);
                      });
                      t.SetApartmentState(ApartmentState.STA);
                      t.IsBackground = true;
                      t.Start();
                      if (!ready.WaitOne(10000)) throw new Exception("the target window never showed");
                  }
                  public string Text() { return (string)box.Invoke(new Func<string>(() => box.Text)); }
                  // The user's edit: the box's text changed in place, the caret at its end.
                  public void Edit(string from, string to) {
                      box.Invoke(new Action(() => { box.Text = box.Text.Replace(from, to); box.SelectionStart = box.Text.Length; }));
                  }
              }
          }
          '@
          $exe = (Resolve-Path 'target\shipping\akou-capture.exe').Path
          # A child's stdin writer takes this encoding, and the runner's UTF-8 default writes a
          # byte order mark the moment the child starts, which spoils the first line sent.
          [Console]::InputEncoding = New-Object System.Text.UTF8Encoding $false
          # Both arguments are evaluated first: never put a call with an effect in `$why`.
          function Check($ok, $why) { if (-not $ok) { throw $why } }

          # The hook swallows the dictation key and passes the rest.
          $chord = 'd:A2 d:A0 d:20 u:20 u:A0 u:A2 d:41 u:41'
          [Probe]::Hook()
          $control = [Probe]::Play($chord)
          "control: $control"
          Check ($control -match 'down:20') 'with no helper Space must get through'
          $h = New-Object 'Probe+Helper' $exe, 'dictate --hotkey Control+Shift+Space --warm off'
          if (-not $h.Wait('"type":"ready"', 10000)) { throw ('the helper never got ready: ' + $h.Stop()) }
          $tapped = [Probe]::Play($chord)
          "hooked: $tapped"
          $log = $h.Stop()
          $log
          Check ($log -match '"backend":"llhook","swallow_keys":true') 'the helper installed no hook'
          Check ($log -notmatch 'bad-command') 'the helper could not read a line this step sent'
          Check ($log -notmatch 'no-tap') 'the helper reported no hook'
          # No microphone on this runner: the press reaching the session shows as the open it tried.
          Check ($log -match '"code":"mic-open"|"type":"mic","open":true') 'the press never reached the session'
          foreach ($k in 'down:A2', 'down:A0', 'up:A0', 'up:A2', 'down:41', 'up:41') {
            Check ($tapped -match $k) "$k was swallowed"
          }
          Check ($tapped -notmatch 'down:20|up:20') 'the dictation key reached the app'

          # The paste, the send key, the typing and the clipboard restore into a real text box.
          Set-Clipboard -Value 'copied before akou'
          Check ((Get-Clipboard) -eq 'copied before akou') 'Set-Clipboard did not take'
          $target = New-Object 'Probe+Target'
          [Probe]::Raise($target.Hwnd)
          "in front: $([Probe]::Front()), target: $($target.Hwnd.ToInt64()) pid $PID"
          $app = [Probe]::Exe()
          "app: $app, module name: $([Diagnostics.Process]::GetCurrentProcess().MainModule.ModuleName)"
          $tj = '{"app":"' + $app + '","pid":' + $PID + ',"window":"' + $target.Hwnd.ToInt64() + '","field":"editable"}'
          Check ($target.Text() -eq '') 'the box was not empty'
          $h = New-Object 'Probe+Helper' $exe, 'dictate --warm off'
          if (-not $h.Wait('"type":"ready"', 10000)) { throw ('the helper never got ready: ' + $h.Stop()) }
          $h.Send('{"type":"focus","target":' + $tj + '}')
          $h.Send('{"type":"insert","id":"p1","text":"pasted by akou","method":"paste","send_key":"Enter","read_field":true,"target":' + $tj + '}')
          if (-not $h.Wait('"id":"p1"', 15000)) { throw ('no answer to the paste: ' + $h.Stop()) }
          # DC-L2: the user fixes a word in the field and presses Return, where the helper reads
          # the field again and sends only the changed words.
          [Probe]::Pump(500)
          $target.Edit('by akou', 'by Akou')
          $null = [Probe]::Play('d:0D u:0D')
          if (-not $h.Wait('"type":"edit', 5000)) { throw ('no read-back after Return: ' + $h.Stop()) }
          $h.Send('{"type":"insert","id":"t1","text":"typed \u00e9 \ud83d\ude00","method":"type","send_key":"none","target":' + $tj + '}')
          if (-not $h.Wait('"id":"t1"', 15000)) { throw ('no answer to the typing: ' + $h.Stop()) }
          [Probe]::Pump(500)
          "in front after the inserts: $([Probe]::Front())"
          $log = $h.Stop()
          $log
          $field = $target.Text()
          $clip = Get-Clipboard -Raw
          "field: $field"
          "clipboard: $clip"
          Check ($log -notmatch 'bad-command') 'the helper could not read a line this step sent'
          Check ($log -match '"type":"inserted","id":"p1","method":"paste"') 'the paste was not read'
          Check ($log -match '"type":"inserted","id":"t1","method":"type"') 'the typing failed'
          Check ($log -match '"type":"edit","id":"p1","hunks":\[\{"inserted":"akou","now":"Akou","at":2\}\]') 'the read-back did not carry exactly the fixed word'
          $want = "pasted by Akou`r`n`r`ntyped " + [char]0xE9 + ' ' + [char]::ConvertFromUtf32(0x1F600)
          Check ($field -ceq $want) 'the box holds the wrong text'
          Check ($clip.TrimEnd() -eq 'copied before akou') "the clipboard was not restored: $clip"

          # A lone Right Win bound to dictation is masked.
          $lone = 'd:5C u:5C'
          $h = New-Object 'Probe+Helper' $exe, 'dictate --hotkey RightWin --warm off'
          if (-not $h.Wait('"type":"ready"', 10000)) { throw ('the helper never got ready: ' + $h.Stop()) }
          $masked = [Probe]::Play($lone)
          "hooked: $masked"
          $null = $h.Stop()
          Check ($masked -match 'down:5C down:E8 up:E8 up:5C') 'the release was not masked'
          $control = [Probe]::Play($lone)
          "control: $control"
          Check ($control -match 'down:5C up:5C' -and $control -notmatch 'E8') 'with no helper the release is not masked'

          # DC-A6: the back button bound as Mouse4 starts a session through the mouse hook and
          # never reaches the app (so a browser does not also go back a page).
          $click = 'd:1 u:1'
          [Probe]::HookMouse()
          $control = [Probe]::PlayMouse($click)
          "mouse control: $control"
          Check ($control -match 'xdown:1 xup:1') 'with no helper the back button must get through'
          $h = New-Object 'Probe+Helper' $exe, 'dictate --hotkey Mouse4 --warm off'
          if (-not $h.Wait('"type":"ready"', 10000)) { throw ('the helper never got ready: ' + $h.Stop()) }
          $clicked = [Probe]::PlayMouse($click)
          "mouse hooked: $clicked"
          $log = $h.Stop()
          $log
          Check ($log -match '"code":"mic-open"|"type":"mic","open":true') 'the back button never reached the session'
          Check ($clicked -notmatch 'xdown:1|xup:1') 'the back button reached the app'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # cargo test writes no JUnit on stable Rust, so its own result lines become one: each
      # `test <name> ... ok|FAILED|ignored` line of both builds is a test case, and the `helper`
      # floor counts them (DC-T2), so a Rust test that stops running fails the job.
      - name: cargo test floor
        run: |
          awk '
            function esc(v) { gsub(/&/, "\\&amp;", v); gsub(/</, "\\&lt;", v); gsub(/>/, "\\&gt;", v); gsub(/"/, "\\&quot;", v); return v }
            /^test .* \.\.\. (ok|FAILED|ignored)/ {
              n++; name = $0; sub(/^test /, "", name); sub(/ \.\.\. .*$/, "", name); name = esc(name)
              if ($0 ~ /\.\.\. ok/) cases = cases "<testcase name=\"" name "\"/>\n"
              else if ($0 ~ /\.\.\. FAILED/) { f++; cases = cases "<testcase name=\"" name "\"><failure/></testcase>\n" }
              else { s++; cases = cases "<testcase name=\"" name "\">\n<skipped />\n</testcase>\n" }
            }
            END { printf "<testsuites tests=\"%d\" failures=\"%d\" skipped=\"%d\">\n<testsuite name=\"cargo test\">\n%s</testsuite>\n</testsuites>\n", n, f, s, cases }
          ' .cargo-test.log > .junit-helper.xml
          bun scripts/ci/test-floor.ts helper .junit-helper.xml
      # The capture traps, the app's dictation service over `dictate` (DC-T1) and DC-N4's words
      # from the WAV to the transcript, against the simulate build.
      - name: capture traps and dictation against the built helper
        env:
          AKOU_CAPTURE_BIN: ${{ github.workspace }}/native/akou-capture/target/release/akou-capture${{ env.EXE }}
          AKOU_CAPTURE_BIN_SHIPPING: ${{ github.workspace }}/native/akou-capture/target/shipping/akou-capture${{ env.EXE }}
        run: bun test --rerun-each "$TEST_REPEAT" --reporter=junit --reporter-outfile=.junit-capture-e2e.xml tests/capture-rust.e2e.test.ts tests/dictation-helper.e2e.test.ts tests/dictation-preroll.e2e.test.ts
      # With both binaries set every test runs: the floor allows no skip.
      - run: bun scripts/ci/test-floor.ts capture-e2e .junit-capture-e2e.xml

  # ROADMAP M4: the real helper on Linux against virtual devices, through both sound servers it
  # talks to. The PipeWire rig links one stereo stimulus into the mic (left) and the call output
  # (right) in one graph, so both tones start on the same sample and the skew bound is asserted.
  # PulseAudio needs two players, which start a few milliseconds apart, so there the channels are
  # checked and the skew is only reported.
  capture-linux:
    name: capture-linux (${{ matrix.server }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: pipewire
            packages: pipewire pipewire-pulse wireplumber pulseaudio-utils dbus
            play: paplay --device=akou_stim "$STIM"
            max_skew_ms: "20"
            mic_sink: akou_stim
          - server: pulseaudio
            packages: pulseaudio pulseaudio-utils dbus
            play: paplay -d akou_micbus "$STIM_MIC" & paplay -d akou_call "$STIM_CALL"; wait
            max_skew_ms: ""
            mic_sink: akou_micbus
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.repeat > 1 && 60 || 30 }}
    env:
      CARGO_TERM_COLOR: always
      XDG_RUNTIME_DIR: /tmp/akou-rig
      TEST_REPEAT: ${{ inputs.repeat || 1 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: build the shipping helper
        working-directory: native/akou-capture
        run: cargo build --locked --release
      - name: ${{ matrix.server }} with a virtual mic and call output
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ${{ matrix.packages }}
          unset DBUS_SESSION_BUS_ADDRESS
          scripts/capture-rig.sh ${{ matrix.server }} | tee rig.txt
          grep '^DBUS_SESSION_BUS_ADDRESS=' rig.txt >> "$GITHUB_ENV"
      - name: the helper lists the devices
        run: |
          native/akou-capture/target/release/akou-capture devices | tee devices.json
          {
            echo "### devices (${{ matrix.server }})"
            echo
            echo '```json'
            cat devices.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # DC-N1 and DC-A6 on real evdev devices. A virtual keyboard and a virtual mouse are made
      # through uinput, and their nodes are made readable to this user the way the uaccess udev
      # rule does for the user at the seat (an ACL). The shipping helper, on this job's sound
      # server, must start a session from a held Right Control and end it on the release with
      # audio packets on stdout, report A while the recorder is open, and start a session from the
      # mouse's back button when that is the binding. The same Right Control before the ACL, when
      # the helper cannot read the keyboard, must start nothing, or the check proves nothing.
      - name: dictate hears a real evdev keyboard and mouse
        env:
          MIC_SINK: ${{ matrix.mic_sink }}
        run: |
          set -euo pipefail
          bin="$PWD/native/akou-capture/target/release/akou-capture"
          work=$(mktemp -d)
          cd "$work"
          cat > uinput.py <<'EOF'
          import fcntl, os, struct, sys, time
          kind = sys.argv[1]
          fd = os.open("/dev/uinput", os.O_WRONLY | os.O_NONBLOCK)
          UI_SET_EVBIT, UI_SET_KEYBIT, UI_SET_RELBIT = 0x40045564, 0x40045565, 0x40045566
          EV_SYN, EV_KEY, EV_REL = 0, 1, 2
          fcntl.ioctl(fd, UI_SET_EVBIT, EV_KEY)
          if kind == "keyboard":
              for code in range(1, 128):
                  fcntl.ioctl(fd, UI_SET_KEYBIT, code)
          else:
              fcntl.ioctl(fd, UI_SET_EVBIT, EV_REL)
              for code in (0, 1):
                  fcntl.ioctl(fd, UI_SET_RELBIT, code)
              for code in range(0x110, 0x118):
                  fcntl.ioctl(fd, UI_SET_KEYBIT, code)
          os.write(fd, struct.pack("80sHHHHi256i", ("akou-ci-" + kind).encode(), 3, 1, 1, 1, 0, *([0] * 256)))
          fcntl.ioctl(fd, 0x5501)
          print("ready", flush=True)
          for line in sys.stdin:
              parts = line.split()
              if not parts:
                  continue
              if parts[0] == "wait":
                  time.sleep(int(parts[1]) / 1000)
                  continue
              os.write(fd, struct.pack("llHHi", 0, 0, EV_KEY, int(parts[0]), int(parts[1])))
              os.write(fd, struct.pack("llHHi", 0, 0, EV_SYN, 0, 0))
          fcntl.ioctl(fd, 0x5502)
          EOF
          python3 -c 'import math, struct, wave
          w = wave.open("tone.wav", "wb"); w.setnchannels(1); w.setsampwidth(2); w.setframerate(48000)
          w.writeframes(b"".join(struct.pack("<h", int(8000 * math.sin(2 * math.pi * 440 * i / 48000))) for i in range(48000 * 90)))'
          paplay -d "$MIC_SINK" tone.wav &
          player=$!
          sudo modprobe uinput || true
          command -v setfacl >/dev/null || sudo apt-get install -y -qq acl
          mkfifo kb.fifo mouse.fifo
          exec 4<>kb.fifo 5<>mouse.fifo
          sudo python3 uinput.py keyboard <kb.fifo >kb.out &
          sudo python3 uinput.py mouse <mouse.fifo >mouse.out &
          node() {
            for d in /sys/class/input/event*; do
              if [ "$(cat "$d/device/name" 2>/dev/null)" = "$1" ]; then echo "/dev/input/${d##*/}"; fi
            done
          }
          for _ in $(seq 1 50); do
            kb=$(node akou-ci-keyboard); mouse=$(node akou-ci-mouse)
            if [ -n "$kb" ] && [ -n "$mouse" ] && [ -e "$kb" ] && [ -e "$mouse" ]; then break; fi
            sleep 0.1
          done
          echo "keyboard $kb, mouse $mouse"
          test -n "$kb" && test -n "$mouse"
          # hold TAG HOTKEY FD CODE: starts the helper, holds CODE for 2 s (a cold PulseAudio stream
          # can take most of a second to deliver its first sample), then (for the
          # keyboard) opens the recorder and taps A, and stops the helper.
          hold() {
            mkfifo "$1.in"
            exec 3<>"$1.in"
            "$bin" dictate --hotkey "$2" <"$1.in" >"$1.akp" 2>"$1.err" &
            local pid=$!
            sleep 1.5
            printf '%s 1\nwait 2000\n%s 0\nwait 1500\n' "$4" "$4" >&"$3"
            sleep 4.5
            if [ "$1" = keys ]; then
              echo '{"type":"record_keys","on":true}' >&3
              sleep 0.3
              printf '30 1\nwait 50\n30 0\n' >&4
              sleep 1
            fi
            echo '{"type":"stop"}' >&3
            for _ in $(seq 1 50); do kill -0 "$pid" 2>/dev/null || break; sleep 0.1; done
            kill "$pid" 2>/dev/null || true
            exec 3>&-
            echo "--- $1"
            cat "$1.err"
          }
          check() { if ! eval "$1"; then echo "FAILED: $2"; exit 1; fi; }
          check '! test -r "$kb"' "the virtual keyboard is readable before the ACL; the control proves nothing"
          hold control RightControl 4 97
          check '! grep -q "\"type\":\"session.started\"" control.err' "a session started with the keyboard unreadable"
          sudo setfacl -m "u:$(id -un):r" "$kb" "$mouse"
          "$bin" dictate --probe 2> probe.err
          cat probe.err
          check 'grep -q "\"accessibility\":\"granted\"" probe.err' "the probe does not see the readable keyboard"
          hold keys RightControl 4 97
          check 'grep -q "\"type\":\"session.started\"" keys.err' "a held Right Control started no session"
          check 'grep -q "\"type\":\"session.ended\",\"id\":\"[^\"]*\",\"reason\":\"release\"" keys.err' "the release did not end the session"
          check '[ "$(head -c 4 keys.akp)" = AKP1 ]' "no audio packets on stdout"
          check 'grep -q "\"type\":\"key\",\"name\":\"A\"" keys.err' "the recorder did not report A"
          hold mouse Mouse4 5 275
          check 'grep -q "\"type\":\"session.started\"" mouse.err' "the back button bound as Mouse4 started no session"
          exec 4>&- 5>&-
          kill "$player" 2>/dev/null || true
          {
            echo "### dictate on evdev (${{ matrix.server }})"
            echo
            grep -hE '"type":"(ready|session\.(started|ended)|key)"' keys.err mouse.err | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
      # DC-U8 on a real session bus. Two MPRIS players, one playing and one paused, sit on this
      # job's bus; the shipping helper runs sessions through the tray's door (`session.start`,
      # `session.stop`). With `pause_media` on, the session pauses the playing player while it
      # listens and plays it again at its end, and `stop` in the middle of a session gives it back
      # too; the paused player is never started. The same session with the setting never sent
      # (the default) touches neither, or the check proves nothing.
      - name: dictate pauses a playing MPRIS player for the session and gives it back
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq --no-install-recommends python3-dbus python3-gi
          bin="$PWD/native/akou-capture/target/release/akou-capture"
          work=$(mktemp -d)
          cd "$work"
          cat > player.py <<'EOF'
          import sys, dbus, dbus.service, dbus.mainloop.glib
          from gi.repository import GLib
          dbus.mainloop.glib.DBusGMainLoop(set_as_default=True)
          PLAYER = "org.mpris.MediaPlayer2.Player"
          class Player(dbus.service.Object):
              def __init__(self, bus, name, status):
                  self.status = status
                  dbus.service.Object.__init__(self, dbus.service.BusName("org.mpris.MediaPlayer2." + name, bus), "/org/mpris/MediaPlayer2")
              @dbus.service.method(PLAYER)
              def Pause(self):
                  self.status = "Paused"
                  print("Pause", flush=True)
              @dbus.service.method(PLAYER)
              def Play(self):
                  self.status = "Playing"
                  print("Play", flush=True)
              @dbus.service.method(dbus.PROPERTIES_IFACE, in_signature="ss", out_signature="v")
              def Get(self, iface, prop):
                  return dbus.String(self.status)
              @dbus.service.method(dbus.PROPERTIES_IFACE, in_signature="s", out_signature="a{sv}")
              def GetAll(self, iface):
                  return {"PlaybackStatus": dbus.String(self.status)}
          player = Player(dbus.SessionBus(), sys.argv[1], sys.argv[2])
          print("ready", flush=True)
          GLib.MainLoop().run()
          EOF
          # Appending, so a file emptied between runs is written from its start again.
          python3 player.py music Playing >> music.out &
          music=$!
          python3 player.py podcast Paused >> podcast.out &
          podcast=$!
          for _ in $(seq 1 50); do
            if grep -q ready music.out && grep -q ready podcast.out; then break; fi
            sleep 0.1
          done
          grep -q ready music.out && grep -q ready podcast.out
          # run TAG LINES...: the helper with these stdin lines, one every 1.5 s, then its exit.
          run() {
            local tag=$1
            shift
            : > "$tag.log"
            : > music.out
            : > podcast.out
            {
              for l in "$@"; do
                sleep 1.5
                echo "$l"
                if [ "$l" != '{"type":"stop"}' ]; then sleep 1.5; echo "--- after $l: $(tr '\n' ' ' < music.out)" >> "$tag.log"; fi
              done
            } | "$bin" dictate --warm off > /dev/null 2> "$tag.err"
            echo "--- $tag"
            cat "$tag.err"
            cat "$tag.log"
            echo "music: $(tr '\n' ' ' < music.out)"
            echo "podcast: $(tr '\n' ' ' < podcast.out)"
          }
          check() { if ! eval "$1"; then echo "FAILED: $2"; exit 1; fi; }
          run control '{"type":"session.start"}' '{"type":"session.stop"}' '{"type":"stop"}'
          check '[ ! -s music.out ] && [ ! -s podcast.out ]' "a player was touched with pause_media never sent"
          run paused '{"type":"pause_media","on":true}' '{"type":"session.start"}' '{"type":"session.stop"}' '{"type":"stop"}'
          check 'grep -q "after {\"type\":\"session.start\"}: Pause $" paused.log' "the playing player was not paused while listening"
          check '[ "$(tr "\n" " " < music.out)" = "Pause Play " ]' "the playing player was not given back once at the end"
          check '[ ! -s podcast.out ]' "the paused player was touched"
          run stopped '{"type":"pause_media","on":true}' '{"type":"session.start"}' '{"type":"stop"}'
          check '[ "$(tr "\n" " " < music.out)" = "Pause Play " ]' "stop during a session did not give the player back"
          kill "$music" "$podcast" 2>/dev/null || true
          {
            echo "### dictate pauses MPRIS players (${{ matrix.server }})"
            echo
            sed 's/^/    /' paused.log
          } >> "$GITHUB_STEP_SUMMARY"
      # DC-N1 through the GlobalShortcuts portal. A fake portal on this job's session bus serves
      # org.freedesktop.portal.GlobalShortcuts the way xdg-desktop-portal does: requests answered
      # by a Response signal, sessions closed by Close, Activated and Deactivated sent when this
      # script says. No keyboard is readable here, so only the portal can start a session. The
      # shipping helper must pick the portal backend (and evdev with no portal: the control),
      # register its app id, bind the default chord, run a session from Activated to Deactivated
      # and ignore a press of another shortcut; a rebind to another chord binds it in a new
      # session and closes the old one, and a lone modifier, which neither the portal nor an
      # unreadable keyboard can hear, is refused.
      - name: dictate hears its chord through the GlobalShortcuts portal
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq --no-install-recommends python3-dbus python3-gi
          bin="$PWD/native/akou-capture/target/release/akou-capture"
          work=$(mktemp -d)
          cd "$work"
          cat > portal.py <<'EOF'
          import sys, dbus, dbus.service, dbus.mainloop.glib
          from gi.repository import GLib
          dbus.mainloop.glib.DBusGMainLoop(set_as_default=True)
          DEST, PATH = "org.freedesktop.portal.Desktop", "/org/freedesktop/portal/desktop"
          GS = "org.freedesktop.portal.GlobalShortcuts"
          bus = dbus.SessionBus()
          name = dbus.service.BusName(DEST, bus)
          if bus.get_name_owner(DEST) != bus.get_unique_name():
              print("another process owns", DEST, flush=True)
              sys.exit(1)
          def token(sender):
              return sender[1:].replace(".", "_")
          class Request(dbus.service.Object):
              @dbus.service.signal("org.freedesktop.portal.Request", signature="ua{sv}")
              def Response(self, code, results):
                  pass
          class Session(dbus.service.Object):
              def __init__(self, path):
                  dbus.service.Object.__init__(self, bus, path)
                  self.path = path
              @dbus.service.method("org.freedesktop.portal.Session")
              def Close(self):
                  print("close", self.path, flush=True)
          def answer(path):
              r = Request(bus, path)
              def send():
                  r.Response(dbus.UInt32(0), dbus.Dictionary({}, signature="sv"))
                  return False
              GLib.idle_add(send)
              return dbus.ObjectPath(path)
          sessions = []
          class Portal(dbus.service.Object):
              @dbus.service.method("org.freedesktop.host.portal.Registry", in_signature="sa{sv}")
              def Register(self, app_id, options):
                  print("register", app_id, flush=True)
              @dbus.service.method(dbus.PROPERTIES_IFACE, in_signature="ss", out_signature="v")
              def Get(self, iface, prop):
                  return dbus.UInt32(1)
              @dbus.service.method(GS, in_signature="a{sv}", out_signature="o", sender_keyword="sender")
              def CreateSession(self, options, sender=None):
                  s = f"{PATH}/session/{token(sender)}/{options['session_handle_token']}"
                  Session(s)
                  sessions.append(s)
                  return answer(f"{PATH}/request/{token(sender)}/{options['handle_token']}")
              @dbus.service.method(GS, in_signature="oa(sa{sv})sa{sv}", out_signature="o", sender_keyword="sender")
              def BindShortcuts(self, session, shortcuts, parent, options, sender=None):
                  for sid, o in shortcuts:
                      print("bind", session, sid, o.get("preferred_trigger", ""), flush=True)
                  return answer(f"{PATH}/request/{token(sender)}/{options['handle_token']}")
              @dbus.service.signal(GS, signature="osta{sv}")
              def Activated(self, session, sid, t, options):
                  pass
              @dbus.service.signal(GS, signature="osta{sv}")
              def Deactivated(self, session, sid, t, options):
                  pass
          portal = Portal(bus, PATH)
          def command(fd, cond):
              line = sys.stdin.readline()
              if not line:
                  return False
              what, sid = line.split()
              signal = portal.Activated if what == "activate" else portal.Deactivated
              signal(dbus.ObjectPath(sessions[-1]), sid, dbus.UInt64(0), dbus.Dictionary({}, signature="sv"))
              print(what, sid, flush=True)
              return True
          GLib.io_add_watch(sys.stdin.fileno(), GLib.IO_IN, command)
          print("ready", flush=True)
          GLib.MainLoop().run()
          EOF
          check() { if ! eval "$1"; then echo "FAILED: $2"; exit 1; fi; }
          "$bin" dictate --probe 2> probe-none.err
          cat probe-none.err
          check 'grep -q "\"backend\":\"evdev\"" probe-none.err' "the backend is not evdev with no portal on the bus"
          mkfifo portal.in helper.in
          exec 6<>portal.in 3<>helper.in
          python3 portal.py <portal.in >> portal.out &
          fake=$!
          for _ in $(seq 1 50); do grep -q ready portal.out && break; sleep 0.1; done
          grep -q ready portal.out
          "$bin" dictate --probe 2> probe.err
          cat probe.err
          check 'grep -q "\"backend\":\"portal\"" probe.err' "the backend is not the portal with one on the bus"
          "$bin" dictate --warm off <helper.in >helper.akp 2>helper.err &
          pid=$!
          sleep 1.5
          check 'grep -q "^bind .* dictate CTRL+SHIFT+space$" portal.out' "the default chord was not bound through the portal"
          first=$(grep '^bind ' portal.out | head -1 | cut -d' ' -f2)
          echo 'activate other' >&6
          sleep 1
          check '! grep -q "\"type\":\"session.started\"" helper.err' "a press of another shortcut started a session"
          echo 'activate dictate' >&6
          sleep 2
          echo 'deactivate dictate' >&6
          sleep 1.5
          echo '{"type":"rebind","hotkey":"Control+Alt+D"}' >&3
          sleep 1.5
          echo '{"type":"rebind","hotkey":"RightControl"}' >&3
          sleep 0.5
          echo '{"type":"stop"}' >&3
          for _ in $(seq 1 50); do kill -0 "$pid" 2>/dev/null || break; sleep 0.1; done
          kill "$pid" 2>/dev/null || true
          kill "$fake" 2>/dev/null || true
          exec 3>&- 6>&-
          echo "--- helper"
          cat helper.err
          echo "--- portal"
          cat portal.out
          check 'grep -q "\"type\":\"ready\".*\"backend\":\"portal\"" helper.err' "ready did not name the portal"
          check 'grep -q "^register io.github.geiserx.akou$" portal.out' "the helper did not register its app id"
          check 'grep -q "\"type\":\"session.started\"" helper.err' "Activated started no session"
          check 'grep -q "\"type\":\"session.ended\",\"id\":\"[^\"]*\",\"reason\":\"release\"" helper.err' "Deactivated did not end the session"
          check '[ "$(grep -c "\"type\":\"session.started\"" helper.err)" = 1 ]' "more than one session started"
          check 'grep -q "^bind .* dictate CTRL+ALT+d$" portal.out' "the rebind did not bind the new chord"
          check 'grep -q "^close $first$" portal.out' "the first portal session was not closed on the rebind"
          check 'grep -q "\"type\":\"rebound\",\"hotkey\":\"Control+Alt+D\"" helper.err' "the rebind to a chord was not answered rebound"
          check 'grep -q "\"type\":\"rebind.failed\",\"hotkey\":\"RightControl\"" helper.err' "a lone modifier with no readable keyboard was not refused"
          {
            echo "### dictate through the GlobalShortcuts portal (${{ matrix.server }})"
            echo
            grep -hE '"type":"(ready|session\.(started|ended)|rebound|rebind\.failed)"' helper.err | sed 's/^/    /'
            sed 's/^/    /' portal.out
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: left = mic tone, right = call tone
        env:
          AKOU_CAPTURE_LIVE: "1"
          AKOU_CAPTURE_BIN: ${{ github.workspace }}/native/akou-capture/target/release/akou-capture
          AKOU_CAPTURE_LIVE_PLAY: ${{ matrix.play }}
          AKOU_CAPTURE_LIVE_MAX_SKEW_MS: ${{ matrix.max_skew_ms }}
        run: |
          set -euo pipefail
          bun test --rerun-each "$TEST_REPEAT" --reporter=junit --reporter-outfile=.junit-live.xml tests/capture-live.e2e.test.ts 2>&1 | tee live.log
          # The live test must have run and passed; a skip is not a pass.
          if ! grep -q '(pass) akou-capture against real devices > left = mic tone' live.log; then
            echo "the live capture test did not run"
            exit 1
          fi
          {
            echo "### live capture (${{ matrix.server }})"
            echo
            grep -E '^left|^tone runs|"type":"(capturing|warn)"' live.log | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: bun scripts/ci/test-floor.ts capture-live-${{ matrix.server }} .junit-live.xml
      - name: sound server logs
        if: failure()
        run: tail -n 50 "$XDG_RUNTIME_DIR"/*.log || true

  # ROADMAP M3: the helper on a Windows runner. It must load and list devices. GitHub's Windows
  # runners have no audio endpoint, so a virtual cable (VB-CABLE, through LABSN's CI helper) is
  # installed, and the call side records a tone played through it by process loopback, and a
  # player inside the tree the helper is told to exclude is not heard. The cable is required: a
  # runner where it gives no output endpoint fails the job, because a green job that recorded
  # nothing would claim the exclusion was checked. Which processes the real app's tree holds
  # (ElectroBun's launcher, the WebView2 processes) is the M3 real-call check, not this job.
  capture-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: ${{ inputs.repeat > 1 && 60 || 30 }}
    env:
      CARGO_TERM_COLOR: always
      TEST_REPEAT: ${{ inputs.repeat || 1 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: build the shipping helper
        working-directory: native/akou-capture
        run: cargo build --locked --release
      - name: the helper loads and lists devices before any driver
        run: |
          set +e
          native/akou-capture/target/release/akou-capture.exe devices > before.json 2> before.err
          code=$?
          set -e
          cat before.json before.err
          # 0 (a list, maybe empty) or 69 (no audio service) are answers; anything else is a
          # helper that did not load or crashed.
          if [ "$code" != 0 ] && [ "$code" != 69 ]; then
            echo "akou-capture devices exited $code"
            exit 1
          fi
      - name: a virtual audio cable
        id: cable
        uses: LABSN/sound-ci-helpers@e9d6ba52163a3283714a68412036ddf33f78d49c # v1.0.4
      - name: the Windows audio service
        continue-on-error: true
        shell: pwsh
        run: |
          Set-Service -Name audiosrv -StartupType Automatic
          Start-Service -Name audiosrv
          Get-Service -Name audiosrv, audioendpointbuilder | Format-Table -AutoSize
      - name: devices with the cable
        run: |
          set +e
          native/akou-capture/target/release/akou-capture.exe devices > devices.json 2> devices.err
          code=$?
          set -e
          cat devices.json devices.err
          outputs=$(grep -o '"outputs":\[[^]]*\]' devices.json | grep -o '"id"' | wc -l || true)
          {
            echo "### akou-capture on Windows"
            echo
            echo "- \`devices\` before the cable: $(cat before.json before.err | head -c 400)"
            echo "- cable install: ${{ steps.cable.outcome }}"
            echo "- \`devices\` after (exit $code): $(cat devices.json devices.err | head -c 600)"
            if [ "$outputs" = 0 ]; then
              echo "- **no audio output endpoint on this runner: the loopback test cannot run**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$outputs" = 0 ]; then
            echo "the virtual cable gave no output endpoint; the exclusion test cannot run"
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: process loopback hears a player and leaves out the excluded tree
        env:
          AKOU_CAPTURE_LIVE: "1"
          AKOU_CAPTURE_BIN: ${{ github.workspace }}/native/akou-capture/target/release/akou-capture.exe
          AKOU_CAPTURE_LIVE_MIC: none
          AKOU_CAPTURE_LIVE_EXCLUDE: "1"
          AKOU_CAPTURE_LIVE_PLAY: (New-Object Media.SoundPlayer $env:STIM_CALL).PlaySync()
        run: |
          set -euo pipefail
          bun test --rerun-each "$TEST_REPEAT" --reporter=junit --reporter-outfile=.junit-live.xml tests/capture-live.e2e.test.ts 2>&1 | tee live.log
          # Both live tests must have run and passed; a skip is not a pass.
          for t in 'left = mic tone' 'Own audio in the call channel'; do
            if ! grep -q "(pass) akou-capture against real devices > .*$t" live.log; then
              echo "the live test '$t' did not run"
              exit 1
            fi
          done
          {
            echo
            grep -E '"type":"(capturing|warn)"|call-only|excluded take' live.log | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: bun scripts/ci/test-floor.ts capture-live-windows .junit-live.xml

  # The server image (docs/ux/SERVER.md SV-T1) on both architectures, each on its own runner: build
  # it, pull the fast preset into a cached models volume with the image's own CLI and no server
  # running, start it as install.md says (the port published on 127.0.0.1, `server.behind_proxy` set
  # by AKOU_BEHIND_PROXY, since a container binds 0.0.0.0 and SV-P5 refuses that without it), and ask
  # it for /healthz within 60 s, for /v1/server with no token and for `id -u`; then transcribe an Ogg
  # Opus voice note, an M4A, an MP3 and a WebM in it (SV-P6). The job round trip runs when the
  # server's own /v1/server says it has jobs, webhooks and the event feed, and warns when it does not.
  # Last, akou from the compose example beside Telegram-Archive (SV-T6), on the same gate.
  server:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Under the runner's temp directory: actions/cache refuses a path with `..`, so a models
      # folder beside the workspace never saved. The runner context is not readable in a job's env.
      - name: the models and data folders
        run: |
          echo "MODELS=$RUNNER_TEMP/akou-models" >> "$GITHUB_ENV"
          echo "DATA=$RUNNER_TEMP/akou-data" >> "$GITHUB_ENV"
      - name: build the image
        run: docker build -t akou:ci .
      - name: the fast preset's models, by their pins
        id: models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MODELS }}
          key: akou-models-fast-${{ hashFiles('src/main/asr/models.ts', 'src/main/asr/presets.ts') }}
      - name: akou models pull fast, with no server running (SV-P3)
        run: |
          mkdir -p "$MODELS"
          sudo chown -R 1000:1000 "$MODELS"
          docker run --rm -v "$MODELS:/models" akou:ci models pull fast
      # Saved as soon as the pull is verified, so a later red step never costs the next run 3 GB.
      - if: steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MODELS }}
          key: akou-models-fast-${{ hashFiles('src/main/asr/models.ts', 'src/main/asr/presets.ts') }}
      # Both refusals are one line and an exit code, never a stack trace at the first write.
      - name: the image refuses 0.0.0.0 without AKOU_BEHIND_PROXY (SV-P11) and a /models it cannot write (SV-P12)
        run: |
          set -uo pipefail
          # A data folder of their own, so the server below still starts on an empty one.
          scratch=$(mktemp -d)
          sudo chown 1000:1000 "$scratch"
          code=0
          docker run --rm -v "$scratch:/data" -v "$MODELS:/models" akou:ci > refused.log 2>&1 || code=$?
          cat refused.log
          [ "$code" = 78 ] && grep -q 'server.behind_proxy' refused.log \
            || { echo "want: exited 78 naming server.behind_proxy; got $code"; exit 1; }
          # A folder Docker makes for a bind mount belongs to root; the image runs as uid 1000.
          locked=$(mktemp -d)
          sudo chown root:root "$locked"
          code=0
          docker run --rm -e AKOU_BEHIND_PROXY=true -v "$scratch:/data" -v "$locked:/models" akou:ci > locked.log 2>&1 || code=$?
          cat locked.log
          [ "$code" = 77 ] && grep -q '/models is not writable by uid 1000' locked.log \
            || { echo "want: exited 77 naming /models and uid 1000; got $code"; exit 1; }
      - name: start the server with only AKOU_BEHIND_PROXY and an empty data folder (SV-P5, SV-P11)
        run: |
          mkdir -p "$DATA"
          sudo chown 1000:1000 "$DATA"
          test -z "$(ls -A "$DATA")"
          docker run -d --name akou --add-host=host.docker.internal:host-gateway -e AKOU_BEHIND_PROXY=true \
            -p 127.0.0.1:8476:8476 -v "$DATA:/data" -v "$MODELS:/models" akou:ci
      - name: GET /healthz answers within 60 s (SV-P1)
        run: |
          for _ in $(seq 60); do
            if curl -fsS http://127.0.0.1:8476/healthz; then echo; exit 0; fi
            sleep 1
          done
          echo "no /healthz within 60 s"
          exit 1
      - name: GET /v1/server with no token
        run: curl -fsS http://127.0.0.1:8476/v1/server | tee server.json | jq -e '.name == "akou" and .mode == "server"'
      - name: the server is not root inside (SV-P1)
        run: |
          uid=$(docker exec akou id -u)
          echo "id -u: $uid"
          test "$uid" != 0
      - name: four containers transcribe in the image (SV-P6)
        run: docker run --rm -v "$MODELS:/models" -v "$PWD/scripts:/app/scripts:ro" --entrypoint bun akou:ci scripts/server-smoke.ts /models
      # The round trip needs the job routes (SV-J1), the keys (SV-K2), the event feed (SV-E1) and the
      # webhook (SV-E2). The server says which it has in /v1/server, from its own route table, so a
      # renamed file cannot turn the step off; a skip is a warning on the run, never silent.
      - name: what the server can do
        id: caps
        run: |
          if jq -e '.capabilities.jobs and .capabilities.events and .capabilities.webhooks' server.json; then
            echo "roundtrip=true" >> "$GITHUB_OUTPUT"
          else
            msg="the job round trip did not run: /v1/server says $(jq -c .capabilities server.json)"
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: job round trip by long-poll, event feed and signed webhook
        if: steps.caps.outputs.roundtrip == 'true'
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          curl -fsSL --retry 3 -o "$work/en.wav" https://huggingface.co/csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3/resolve/1a468a35cbba69418f126de829e75261dea4a4e4/test_wavs/en.wav
          echo "148b936b43ce7c546a866e64da059f0458aee2d65e617f16e9d94f06e8d99ed6  $work/en.wav" | sha256sum -c -
          chmod 0777 "$work"
          docker run --rm -v "$work:/work" --entrypoint ffmpeg akou:ci -nostdin -loglevel error -i /work/en.wav -c:a libopus /work/note.ogg
          cp "$work/note.ogg" "$RUNNER_TEMP/note.ogg"
          docker exec akou akou keys create --name ci --scope jobs --callback-host host.docker.internal --json > "$work/key.json"
          AKOU_API_KEY=$(jq -r .key "$work/key.json")
          AKOU_WEBHOOK_SECRET=$(jq -r .secret "$work/key.json")
          export AKOU_API_KEY AKOU_WEBHOOK_SECRET
          docker run --rm --network host -e AKOU_URL=http://127.0.0.1:8476 -e AKOU_API_KEY -e AKOU_WEBHOOK_SECRET \
            -e CALLBACK_HOST=host.docker.internal -v "$work:/work" -v "$PWD/scripts:/app/scripts:ro" \
            --entrypoint bun akou:ci scripts/server-roundtrip.ts /work/note.ogg
          # SV-D1: the same note through `akou transcribe`, the CLI's file job, against `akou serve`
          # on a Linux box with no sound server. It prints the transcript, or the step fails.
          docker run --rm --network host -e AKOU_URL=http://127.0.0.1:8476 -e AKOU_API_KEY \
            -v "$work:/work" akou:ci transcribe /work/note.ogg | tee "$work/transcribe.txt"
          tr 'A-Z' 'a-z' < "$work/transcribe.txt" | tr -cd 'a-z \n' | grep -q "ask not what your country"
      - name: the server's log
        if: always()
        run: docker logs akou 2>&1 | tail -n 200 || true
      # SV-T6: the same image from examples/compose/telegram-archive beside Telegram-Archive's own
      # compose file, set up as SERVER.md section 12.5 says. The archive's backup service sends the
      # note with its own client, akou transcribes it with its default model, and the viewer stores
      # the transcript from the signed callback; a tampered delivery must be refused. The script
      # prints every service's log when it fails.
      - name: akou beside Telegram-Archive from the compose example (SV-T6)
        if: steps.caps.outputs.roundtrip == 'true'
        run: |
          docker rm -f akou
          docker tag akou:ci drumsergio/akou:ci
          AKOU_VERSION=ci MODELS="$MODELS" scripts/compose-e2e.sh "$RUNNER_TEMP/note.ogg"

  # SI-8 (docs/research/service-interface.md): `akou serve` natively on macOS arm64, from a source
  # checkout with no Docker, since Docker on a Mac has no Metal. A Mac mini serving this way is the
  # box another akou sends its GPU jobs to (docs/ux/SERVER.md section 14). The same round trip as
  # the image's: `/healthz`, then one clip by long-poll, event feed and signed webhook, then
  # `akou transcribe`, with an Ogg Opus voice note as Telegram-Archive sends, decoded by the
  # Homebrew ffmpeg a Mac server needs too (install.md).
  server-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: macOS arm64
        run: |
          test "$(uname -m)" = arm64 || { echo "this runner is $(uname -m), not arm64"; exit 1; }
          sw_vers
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: ffmpeg, as install.md tells a Mac server to install it
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          command -v ffmpeg || brew install ffmpeg
          ffmpeg -version | head -n 1
      - name: the models and home folders
        run: |
          echo "AKOU_MODELS_DIR=$RUNNER_TEMP/akou-models" >> "$GITHUB_ENV"
          echo "AKOU_HOME=$RUNNER_TEMP/akou-home" >> "$GITHUB_ENV"
      - name: the fast preset's models, by their pins
        id: models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AKOU_MODELS_DIR }}
          key: akou-models-fast-macos-${{ hashFiles('src/main/asr/models.ts', 'src/main/asr/presets.ts') }}
      # akou refuses downloads when CI is set (models.ts); the image job pulls inside Docker, where
      # it is not. Unset for this one step, as a person at a Mac would run it.
      - name: akou models pull fast, with no server running
        run: env -u CI bun src/main/cli/cli.ts models pull fast
      - if: steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AKOU_MODELS_DIR }}
          key: akou-models-fast-macos-${{ hashFiles('src/main/asr/models.ts', 'src/main/asr/presets.ts') }}
      - name: akou serve, on this machine only
        run: |
          mkdir -p "$AKOU_HOME/.config/akou"
          echo '{ "api.bind": "127.0.0.1" }' > "$AKOU_HOME/.config/akou/config.json"
          nohup bun src/main/cli/cli.ts serve > "$RUNNER_TEMP/serve.log" 2>&1 &
      - name: GET /healthz answers within 120 s
        run: |
          for _ in $(seq 120); do
            if curl -fsS http://127.0.0.1:8476/healthz; then echo; exit 0; fi
            sleep 1
          done
          echo "no /healthz within 120 s"
          exit 1
      - name: GET /v1/server says server mode, fast available
        run: curl -fsS http://127.0.0.1:8476/v1/server | tee server.json | jq -e '.mode == "server" and ([.presets[] | select(.name == "fast")][0].available)'
      - name: a clip by long-poll, event feed and signed webhook, then akou transcribe
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          curl -fsSL --retry 3 -o "$work/en.wav" https://huggingface.co/csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3/resolve/1a468a35cbba69418f126de829e75261dea4a4e4/test_wavs/en.wav
          echo "148b936b43ce7c546a866e64da059f0458aee2d65e617f16e9d94f06e8d99ed6  $work/en.wav" | shasum -a 256 -c -
          ffmpeg -nostdin -loglevel error -i "$work/en.wav" -c:a libopus "$work/note.ogg"
          bun src/main/cli/cli.ts keys create --name ci --scope jobs --callback-host 127.0.0.1 --json > "$work/key.json"
          AKOU_API_KEY=$(jq -r .key "$work/key.json")
          AKOU_WEBHOOK_SECRET=$(jq -r .secret "$work/key.json")
          export AKOU_API_KEY AKOU_WEBHOOK_SECRET
          AKOU_URL=http://127.0.0.1:8476 CALLBACK_HOST=127.0.0.1 bun scripts/server-roundtrip.ts "$work/note.ogg"
          AKOU_URL=http://127.0.0.1:8476 bun src/main/cli/cli.ts transcribe "$work/note.ogg" | tee "$work/transcribe.txt"
          tr 'A-Z' 'a-z' < "$work/transcribe.txt" | tr -cd 'a-z \n' | grep -q "ask not what your country"
      - name: the server's log
        if: always()
        run: tail -n 200 "$RUNNER_TEMP/serve.log" || true

  # The diarization helper (native/akou-diarize) on every OS: format, lint, unit tests and the NOTICE
  # check, the release build, then the real Nemotron model through it in both modes, over a
  # generated two-voice conversation it must tell apart (docs/TESTING.md TS-20). That last step is
  # the one that says the statically linked ONNX Runtime loads and infers on Windows, which no other
  # job covers. The model is fetched here from its pinned URL, checked against its pinned SHA-256
  # and cached by it; akou's own downloader stays off in CI.
  diarize:
    needs: changes
    if: needs.changes.outputs.diarize == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      EXE: ${{ matrix.os == 'windows-latest' && '.exe' || '' }}
      MODEL_URL: https://huggingface.co/altunenes/parakeet-rs/resolve/4d2a8bc71f5c896ec40faa59732e6716295edaf2/nemotron-3-diarization/nemotron3_diar_v3.onnx
      MODEL_SHA256: 915e4fa23b0192ed9fadeb1cdd26847df986d50c92012d177be28d0343bbe03a
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
      - name: cargo fmt --check
        working-directory: native/akou-diarize
        run: cargo fmt --check
      - name: cargo clippy -D warnings
        working-directory: native/akou-diarize
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test (unit and NOTICE)
        working-directory: native/akou-diarize
        run: cargo test --locked
      - name: cargo build --release
        working-directory: native/akou-diarize
        run: |
          cargo build --locked --release
          bin="target/release/akou-diarize$EXE"
          "$bin" --version
          echo "### akou-diarize on ${{ runner.os }}: $(wc -c < "$bin") bytes" >> "$GITHUB_STEP_SUMMARY"
      - name: the model, by its pinned SHA-256
        id: model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models/nemotron3_diar_v3.onnx
          key: nemotron3-diar-${{ env.MODEL_SHA256 }}
      - name: fetch and check the model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fsSL --retry 3 -o models/nemotron3_diar_v3.onnx "$MODEL_URL"
      - name: the model matches its pin
        run: |
          got=$( (sha256sum models/nemotron3_diar_v3.onnx 2>/dev/null || shasum -a 256 models/nemotron3_diar_v3.onnx) | cut -d' ' -f1)
          echo "sha256 $got"
          test "$got" = "$MODEL_SHA256"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: two voices through the real model, final and live
        run: |
          bun scripts/diarize-smoke.ts "native/akou-diarize/target/release/akou-diarize$EXE" models/nemotron3_diar_v3.onnx | tee smoke.log
          { echo; sed 's/^/    /' smoke.log; } >> "$GITHUB_STEP_SUMMARY"

  # The GPU images (akou-5an.94), -vulkan and -cuda, on both architectures. No runner has a GPU, so
  # this proves what can be proved without one: the image's llama-server runs; in -vulkan, the
  # Vulkan loader and Mesa's drivers load (llvmpipe, Mesa's CPU renderer, shows once it is made
  # visible, and never counts as a GPU); in -cuda, every CUDA library resolves in the image but the
  # driver's own, which --gpus all brings; and akou, asked inside each, reports the CPU, verified by
  # the real build, with the reason. The real GPU runs are the operator's (docs/install.md).
  gpu-image:
    needs: changes
    if: needs.changes.outputs.gpu == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        variant: [vulkan, cuda]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build the ${{ matrix.variant }} image
        run: docker build --build-arg ACCELERATOR="$VARIANT" -t "akou:$VARIANT" .
      - name: its llama-server runs
        run: docker run --rm --entrypoint sh "akou:$VARIANT" -c '/opt/llama/llama-server --version'
      - name: the Vulkan loader and Mesa's drivers load (vulkan)
        if: matrix.variant == 'vulkan'
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /opt/llama/llama-server akou:vulkan --list-devices | tee plain.txt
          # No GPU here, and llama.cpp skips a CPU renderer unless it is named: nothing listed.
          if grep -q 'Vulkan0' plain.txt; then echo "a Vulkan device on a runner with no GPU"; exit 1; fi
          docker run --rm -e GGML_VK_VISIBLE_DEVICES=0 --entrypoint /opt/llama/llama-server akou:vulkan --list-devices | tee named.txt
          grep -q 'Vulkan0: llvmpipe' named.txt
      - name: every CUDA library resolves but the driver's (cuda)
        if: matrix.variant == 'cuda'
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh akou:cuda -c 'ldd /opt/llama/libggml-cuda.so' | tee ldd.txt
          missing=$(grep 'not found' ldd.txt | awk '{print $1}' | sort -u | tr '\n' ' ')
          echo "missing: $missing"
          test "$missing" = "libcuda.so.1 "
      - name: akou inside reports the CPU, verified by the build, and why
        run: |
          set -euo pipefail
          report() { docker run --rm "$@" -v "$PWD/scripts:/app/scripts:ro" --entrypoint bun "akou:$VARIANT" scripts/accelerator-report.ts; }
          report | tee auto.json
          jq -e --arg v "$VARIANT" '.available == [$v, "cpu"] and .active == "cpu" and .gpu == null and .verified and .reason == "no GPU found"' auto.json
          # Asked for its GPU on purpose, it runs the build and says what the build listed.
          if [ "$VARIANT" = vulkan ]; then
            report -e AKOU_ACCELERATOR=vulkan -e GGML_VK_VISIBLE_DEVICES=0 | tee forced.json
            jq -e '.active == "cpu" and .verified and (.reason | contains("llvmpipe"))' forced.json
          else
            report -e AKOU_ACCELERATOR=cuda | tee forced.json
            jq -e '.active == "cpu" and .verified and (.reason | contains("lists no cuda device"))' forced.json
          fi

  # docs/research/service-interface.md SI-2: a real Executor (executor@1.6.8, pinned by the
  # lockfile in scripts/ci/executor/, in a throwaway home) adds akou from the served
  # `GET /v1/openapi.json?scope=jobs` and must see the tools jobs.create, jobs.get and keys.me, no
  # openai.transcribe and one auth template; the same against a server that wants a key on the
  # file must fail with Executor's HTTP 401. A route not built yet comes from the test fixture,
  # only where the table has none, and the job summary names it.
  executor:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: executor 1.6.8 from npm, from its lockfile
        run: npm ci --no-audit --no-fund --prefix scripts/ci/executor
      - run: bun scripts/ci/executor-roundtrip.ts --executor scripts/ci/executor/node_modules/.bin/executor

  # The one required check. `if: always()` so it reports even when a leg failed; it fails when any
  # leg failed or was cancelled, and passes when legs were skipped for a docs-only change.
  ci-ok:
    if: always()
    needs: [changes, check, ui, helper, capture-linux, capture-windows, server, server-macos, diarize, gpu-image, executor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every leg passed or was skipped on purpose
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "a leg failed or was cancelled"
            exit 1
          fi
