name: release

# The release (docs/DESIGN.md section 9, scripts/release-checklist.md). On a `v*` tag it checks that
# every version string equals the tag, builds the capture helper, the macOS app and the CLI binaries
# (the macOS ones signed with the Developer ID and notarized), checks each built artifact without
# opening anything,
# and publishes a GitHub Release (a prerelease while the version is 0.x) with SHA256SUMS, a build
# attestation for every asset, and notes that start with the version's CHANGELOG.md section.
# It then replaces the update feed the app's updater reads (docs/CI-CD.md CI-23). It also builds and
# checks the desktop app on Windows and Linux, which it does not publish yet.
#
# A tag runs no tests: it releases only a commit whose ci-ok is green (docs/CI-CD.md CI-19).
#
# Run it by hand (workflow_dispatch) for a dry run: the same builds and checks, the artifacts
# uploaded to the run, and no release. `allow_missing_helper` lets a dry run build the app before
# native/akou-capture is on the branch; a tag never can. A pull request that touches the packaging
# runs the dry run too.
#
# Signing: a tag or a dispatch reads the secrets the `app` job names (MACOS_CERTIFICATE_P12 and its
# password, the ELECTROBUN_DEVELOPER_ID identity, ELECTROBUN_TEAMID, ELECTROBUN_APPLEID,
# ELECTROBUN_APPLEIDPASS) and fails when one is missing. Hutch signs the app with the Developer ID
# and notarizes it, build-cli.ts does the same for the CLI, and the job checks both before upload.

on:
  push:
    tags: ["v*"]
  # A pull request that changes the packaging runs the same dry run, so a broken bundle is caught
  # before a tag. Until native/akou-capture is on the branch it builds without the helper and says so.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - electrobun.config.ts
      - assets/brand/akou.iconset/**
      - scripts/app-icon.ts
      - package.json
      - bun.lock
      - scripts/build-app.ts
      - scripts/build-cli.ts
      - scripts/smoke-app.ts
      - scripts/gates/g2-worker.ts
      - scripts/gates/g2-probe.ts
      - scripts/gates/g1-shell.ts
      - scripts/gates/g1-sni-watcher.py
      - scripts/clip.ts
      - scripts/check-feed.ts
      - scripts/locate-helper-probe.ts
      - scripts/smoke-cli.ts
      - scripts/stamp-version.ts
      - scripts/build-dictionaries.ts
      - src/main/vocab/dictionaries/**
      - scripts/post-build.ts
      - scripts/post-wrap.ts
      - scripts/patch-plist.sh
      - Dockerfile
      - .dockerignore
  workflow_dispatch:
    inputs:
      allow_missing_helper:
        description: "Dry run only: build the app without native/akou-capture"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.2
  RUST_VERSION: 1.97.1

jobs:
  version:
    runs-on: ubuntu-latest
    # The tested-commit step may wait for CI on the tagged commit to finish.
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag: a stable version's terms check must be dated after the previous stable tag
          # (docs/CI-CD.md CI-28), and a shallow checkout has no tags to compare with.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: every version string equals the tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            bun scripts/stamp-version.ts --check --tag "$REF_NAME"
          else
            bun scripts/stamp-version.ts --check
          fi
      - name: the bundled word lists are what the build script makes from its pinned source
        run: bun scripts/build-dictionaries.ts --check
      # The release notes start with this version's CHANGELOG.md section (docs/CI-CD.md CI-20);
      # `--check` above already failed if it is missing.
      - name: the version's changelog section, for the release notes
        run: |
          mkdir -p notes
          bun scripts/stamp-version.ts --notes > notes/changelog.md
          cat notes/changelog.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes
          path: notes/changelog.md
          if-no-files-found: error
          retention-days: 14
      # A tag releases only a commit CI already passed (docs/CI-CD.md CI-19), so the tests are not
      # run again here: the newest ci.yml run of the tagged commit must end with ci-ok green. A pull
      # request or a dry run has its own ci.yml run.
      - name: the tagged commit passed ci-ok
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: bun scripts/ci/tested-commit.ts "$SHA" --wait-minutes 90

  app:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Hutch signs the app with the Developer ID and notarizes it; build-cli.ts does the same for
      # the CLI. A pushed tag (this workflow's only push trigger is v* tags) or a dispatch by hand
      # reads the secrets and fails without them. A pull request's dry run runs the branch's own
      # build scripts and must never have a signing secret in reach, so it builds ad-hoc (CI-16).
      SIGN: ${{ github.event_name != 'pull_request' }}
      ELECTROBUN_DEVELOPER_ID: ${{ github.event_name != 'pull_request' && secrets.ELECTROBUN_DEVELOPER_ID || '' }}
      ELECTROBUN_TEAMID: ${{ github.event_name != 'pull_request' && secrets.ELECTROBUN_TEAMID || '' }}
      ELECTROBUN_APPLEID: ${{ github.event_name != 'pull_request' && secrets.ELECTROBUN_APPLEID || '' }}
      ELECTROBUN_APPLEIDPASS: ${{ github.event_name != 'pull_request' && secrets.ELECTROBUN_APPLEIDPASS || '' }}
      HELPER_FLAG: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.allow_missing_helper)) && '--allow-missing-helper' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: macOS arm64 only
        run: |
          test "$(uname -m)" = arm64 || { echo "the app is built on arm64; this runner is $(uname -m)"; exit 1; }
          sw_vers
      - name: the capture helper is in this tree
        run: |
          if [ ! -f native/akou-capture/Cargo.toml ]; then
            if [ -n "$HELPER_FLAG" ]; then
              echo "::warning::native/akou-capture is absent: this dry run builds the app WITHOUT the capture helper"
            else
              echo "::error::native/akou-capture is absent, so there is no capture helper to ship. Merge the helper (PR #6) before tagging."
              exit 1
            fi
          fi
      - name: Rust ${{ env.RUST_VERSION }}
        if: hashFiles('native/akou-capture/Cargo.toml') != ''
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          cargo --version
      - name: every signing secret, and the Developer ID certificate in a keychain of its own
        env:
          MACOS_CERTIFICATE_P12: ${{ github.event_name != 'pull_request' && secrets.MACOS_CERTIFICATE_P12 || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
        if: env.SIGN == 'true'
        run: |
          missing=""
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD ELECTROBUN_DEVELOPER_ID \
            ELECTROBUN_TEAMID ELECTROBUN_APPLEID ELECTROBUN_APPLEIDPASS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::a tag or a dispatch signs and notarizes the macOS builds, and these secrets are missing:$missing"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass="$(openssl rand -hex 24)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Hutch and the ElectroBun runtime, cached by their pins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.hutch
          key: hutch-macos-arm64-electrobun-2.0.1-hutch-0.24.3
      - name: build the app (helper, pages, Workers, ElectroBun through Hutch)
        run: bun scripts/build-app.ts ${HELPER_FLAG:+"$HELPER_FLAG"}
      - name: check the built app without opening it
        run: bun scripts/smoke-app.ts ${HELPER_FLAG:+"$HELPER_FLAG"}
      - name: the update feed is for this app and this version (docs/CI-CD.md CI-23)
        run: bun scripts/check-feed.ts --dir dist/release
      - name: the recognizer, cached by its pins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: eval-models
          key: recognizer-${{ runner.os }}-${{ hashFiles('src/main/asr/models.ts') }}
      # Prereleases never wait on a gate (ROADMAP M0), so here the result is recorded, not enforced.
      # continue-on-error absorbs a failure but not a stall: a slow model download must not push
      # this release job into its own limit.
      - name: G2, recognition in a Worker of the packaged app (ROADMAP; recorded, not enforced)
        continue-on-error: true
        timeout-minutes: 15
        run: bun scripts/gates/g2-worker.ts --models eval-models --out gate-g2-macOS.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gate-g2-macOS
          path: gate-g2-macOS.json
          if-no-files-found: warn
          retention-days: 90
      - name: build the CLI (bun build --compile, codesign, --verify --strict, notarized when signed)
        run: bun scripts/build-cli.ts
      - name: check the CLI binary headless
        run: bun scripts/smoke-cli.ts
      # The files that ship, as a user gets them: Gatekeeper must see a notarized Developer ID app
      # in the zip and in the DMG, and Apple must know the CLI's notarization (a bare binary cannot
      # be stapled, so it is checked online, which can lag the notary's answer by a minute).
      - name: the app and the CLI are signed by the Developer ID and notarized
        if: env.SIGN == 'true'
        run: |
          set -euo pipefail
          check="$RUNNER_TEMP/signed"
          rm -rf "$check" && mkdir -p "$check/zip" "$check/dmg" "$check/cli"
          signed_by_team() {
            info=$(codesign -dv --verbose=2 "$1" 2>&1)
            grep -qx "TeamIdentifier=$ELECTROBUN_TEAMID" <<<"$info" || { echo "::error::$1 is not signed by the Developer ID's team"; exit 1; }
            grep -q '^CodeDirectory .*flags=.*(runtime)' <<<"$info" || { echo "::error::$1 lacks the hardened runtime"; exit 1; }
          }
          notarized_app() {
            signed_by_team "$1"
            spctl --assess --type execute -vv "$1" 2>&1 | grep -x 'source=Notarized Developer ID' \
              || { echo "::error::Gatekeeper does not see $1 as a notarized Developer ID app"; exit 1; }
            xcrun stapler validate "$1"
          }
          ditto -x -k dist/release/akou-*-macos-arm64.zip "$check/zip"
          notarized_app "$check/zip/akou.app"
          hdiutil attach -nobrowse -readonly -mountpoint "$check/dmg" dist/release/akou-*-macos-arm64.dmg >/dev/null
          trap 'hdiutil detach "$check/dmg" >/dev/null' EXIT
          notarized_app "$check/dmg/akou.app"
          tar -xzf dist/release/akou-cli-*-darwin-arm64.tar.gz -C "$check/cli"
          cli=$(echo "$check"/cli/*/akou)
          signed_by_team "$cli"
          for try in $(seq 1 12); do
            if codesign --verify --strict --check-notarization -R=notarized "$cli"; then
              echo "ok: the CLI is notarized"
              exit 0
            fi
            echo "the CLI's notarization is not visible yet (try $try of 12)"
            sleep 10
          done
          echo "::error::Apple does not report the CLI as notarized"
          exit 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-arm64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  # The desktop app on Windows x64 and Linux x64 (ROADMAP G1, G2), each built on its own runner
  # because ElectroBun cannot cross-compile, then checked without opening a window. Not published:
  # the artifacts stay on the run until the Windows and Linux milestones ship an installer, so the
  # release does not wait for this job.
  app-desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          cargo --version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Hutch and the ElectroBun runtime, cached by their pins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.hutch
          key: hutch-${{ runner.os }}-x64-electrobun-2.0.1-hutch-0.24.3
      - name: build the app (helpers, pages, Workers, ElectroBun through Hutch)
        run: bun scripts/build-app.ts
      - name: check the built app without opening it
        run: bun scripts/smoke-app.ts
      # The recognizer's files are checked against their pins in src/main/asr/models.ts on every
      # use, so a stale cache costs a download, never a wrong model. The nightly shares this cache.
      - name: the recognizer, cached by its pins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: eval-models
          key: recognizer-${{ runner.os }}-${{ hashFiles('src/main/asr/models.ts') }}
      - name: G2, recognition in a Worker of the packaged app (ROADMAP)
        run: bun scripts/gates/g2-worker.ts --models eval-models --out "gate-g2-${{ runner.os }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gate-g2-${{ runner.os }}
          path: gate-g2-*.json
          if-no-files-found: warn
          retention-days: 90
      # G1, the shell (ROADMAP): the packaged app's window, tray item, global hotkey, login item
      # and headless start. Linux runs on an X display (Xvfb with Openbox) and a session bus with a
      # StatusNotifierWatcher, so Wayland is not covered. It records and never blocks: the verdict
      # is in the JSON, which docs/gates/M0-results.md carries.
      - name: G1 tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb xauth openbox wmctrl xdotool \
            imagemagick dbus dbus-x11 python3-gi gir1.2-glib-2.0 libgtk-3-0t64 \
            libwebkit2gtk-4.1-0 libayatana-appindicator3-1
      - name: G1, the shell of the packaged app (ROADMAP)
        continue-on-error: true
        run: |
          gate=(bun scripts/gates/g1-shell.ts --models eval-models --out "gate-g1-$RUNNER_OS.json" --shots gate-g1-shots)
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- "${gate[@]}"
          else
            "${gate[@]}"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gate-g1-${{ runner.os }}
          path: |
            gate-g1-*.json
            gate-g1-shots/
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-${{ runner.os }}-x64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  # The CLI on each machine it is released for, built on that machine (linux-arm64 is the
  # Raspberry Pi and arm64 server build, SV-P8).
  cli:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: build the CLI (bun build --compile)
        run: bun scripts/build-cli.ts
      - name: check the CLI binary headless
        run: bun scripts/smoke-cli.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-cli-${{ runner.os }}-${{ runner.arch }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  # The server image (docs/ux/SERVER.md SV-P1), built natively on each architecture's runner from
  # the tag's tree, in three variants (akou-5an.94): cpu, vulkan (Intel and AMD GPUs) and cuda
  # (NVIDIA). A tag pushes each build by digest, and `image-manifest` joins the two architectures of
  # each under drumsergio/akou:<version>, <version>-vulkan and <version>-cuda. There is never a
  # `latest` tag. A pull request or a dry run builds them all and pushes nothing. Pushing needs
  # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in the repository.
  image:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            variant: cpu
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            variant: cpu
          - runner: ubuntu-24.04
            platform: linux/amd64
            variant: vulkan
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            variant: vulkan
          - runner: ubuntu-24.04
            platform: linux/amd64
            variant: cuda
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            variant: cuda
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
      PLATFORM: ${{ matrix.platform }}
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: log in to Docker Hub (a pushed tag only)
        if: env.PUSH == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ github.event_name == 'push' && secrets.DOCKERHUB_USERNAME || '' }}
          DOCKERHUB_TOKEN: ${{ github.event_name == 'push' && secrets.DOCKERHUB_TOKEN || '' }}
        # Without the secrets `docker login` fails on an empty user name and says nothing of them.
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::a tag pushes drumsergio/akou, so the repository needs the secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN; add both, then run the release again"
            exit 1
          fi
          echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: build ${{ matrix.variant }} for ${{ matrix.platform }} (and push it by digest on a tag)
        run: |
          docker buildx create --use --name akou
          if [ "$PUSH" = true ]; then
            output="type=image,name=docker.io/drumsergio/akou,push-by-digest=true,name-canonical=true,push=true"
          else
            output="type=docker,name=akou:dry-run"
          fi
          docker buildx build --platform "$PLATFORM" --build-arg ACCELERATOR="$VARIANT" \
            --output "$output" --metadata-file meta.json .
          digest=$(jq -r '."containerimage.digest"' meta.json)
          echo "$VARIANT $PLATFORM $digest"
          mkdir -p digests
          echo "$digest" > "digests/$VARIANT-${PLATFORM//\//-}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.variant }}-${{ runner.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    needs: [image]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true
      - name: log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ github.event_name == 'push' && secrets.DOCKERHUB_USERNAME || '' }}
          DOCKERHUB_TOKEN: ${{ github.event_name == 'push' && secrets.DOCKERHUB_TOKEN || '' }}
        # Without the secrets `docker login` fails on an empty user name and says nothing of them.
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::a tag pushes drumsergio/akou, so the repository needs the secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN; add both, then run the release again"
            exit 1
          fi
          echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: drumsergio/akou:<version>, <version>-vulkan and <version>-cuda, each for amd64 and arm64
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          for variant in cpu vulkan cuda; do
            suffix=""
            [ "$variant" = cpu ] || suffix="-$variant"
            refs=$(cat digests/"$variant"-linux-amd64 digests/"$variant"-linux-arm64 | sed 's|^|docker.io/drumsergio/akou@|')
            # Both architectures, or nothing: the step's shell has no pipefail, so count them.
            test "$(printf '%s\n' "$refs" | grep -c .)" = 2
            # shellcheck disable=SC2086
            docker buildx imagetools create --tag "docker.io/drumsergio/akou:$version$suffix" $refs
            docker buildx imagetools inspect "docker.io/drumsergio/akou:$version$suffix"
          done

  # The image of the tag is part of the release: no GitHub release goes out while it failed.
  # Every asset gets a build provenance attestation, the one signature (docs/CI-CD.md CI-21):
  # keyless, so there is no key to guard. `gh attestation verify <file> -R GeiserX/akou` checks one.
  release:
    needs: [app, cli, image-manifest]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # The app bundle goes up twice: to the versioned release and to the update feed.
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # For the feed check after publishing; first, since checkout empties the workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes
          path: notes
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: attest every file SHA256SUMS lists
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: every asset verifies against its attestation
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: |
          for f in akou-* stable-*; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"
          done
      - name: publish the release (a prerelease while 0.x; never a draft)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          version="${TAG#v}"
          prerelease=""
          case "$version" in 0.*|*-*) prerelease="--prerelease" ;; esac
          { cat ../notes/changelog.md; echo; } > notes.md
          cat >> notes.md <<'EOF'
          **Signed and notarized.** The app and the `akou` command line are signed with a Developer ID and notarized by Apple, so macOS opens them without an extra step, and the microphone and system audio grants should survive updates. Coming from 0.6.0 or older, which were not signed, macOS asks for both grants once more. The speech models are downloaded on first run. See [docs/getting-started.md](https://github.com/GeiserX/akou/blob/main/docs/getting-started.md).
          EOF
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "akou $version" \
            --notes-file notes.md \
            --generate-notes \
            ${prerelease:+"$prerelease"} \
            -- akou-* stable-* SHA256SUMS
      # The update feed (docs/CI-CD.md CI-23): the app's updater reads release.baseUrl, the assets of
      # the fixed `update-feed` release, which every tag replaces: the bundle first, then the
      # manifest that names it. The release is created the first time. Its assets are replaced in
      # place, so the repository must keep immutable releases off.
      - name: publish the update feed
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: |
          if ! gh release view update-feed --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create update-feed \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "akou update feed" \
              --notes "The files the app's updater reads. Every release replaces them. To install akou, download it from the newest versioned release." \
              --prerelease \
              --latest=false
          fi
          gh release upload update-feed --repo "$GITHUB_REPOSITORY" --clobber -- stable-*.tar.zst
          gh release upload update-feed --repo "$GITHUB_REPOSITORY" --clobber -- stable-*-update.json
      - name: the published feed offers this version, as the app fetches it
        run: bun scripts/check-feed.ts --url

  # The Homebrew cask (docs/CI-CD.md CI-25): the tap is another repository, which this workflow's
  # token cannot push to, so the bump pushes with TAP_PUSH_TOKEN, a token limited to the tap, and
  # stops with an error naming the secret when it is missing. It runs once the release is out, so
  # the cask never points at a DMG that is not published.
  cask:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: push the cask bump to the tap
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TAP_PUSH_TOKEN: ${{ github.event_name == 'push' && secrets.TAP_PUSH_TOKEN || '' }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
          bun scripts/bump-cask.ts --sums SHA256SUMS
