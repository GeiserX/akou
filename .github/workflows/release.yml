name: release

# The release (docs/DESIGN.md section 9, scripts/release-checklist.md). On a `v*` tag it checks that
# every version string equals the tag, builds the capture helper, the macOS app (unsigned: ad-hoc
# signed, not notarized) and the CLI binaries, checks each built artifact without opening anything,
# and publishes a GitHub Release (a prerelease while the version is 0.x) with SHA256SUMS.
#
# Run it by hand (workflow_dispatch) for a dry run: the same builds and checks, the artifacts
# uploaded to the run, and no release. `allow_missing_helper` lets a dry run build the app before
# native/akou-capture is on the branch; a tag never can. A pull request that touches the packaging
# runs the dry run too.
#
# Signing later: add the secrets the `app` job reads (MACOS_CERTIFICATE_P12 and its password, the
# ELECTROBUN_DEVELOPER_ID identity, ELECTROBUN_TEAMID, ELECTROBUN_APPLEID, ELECTROBUN_APPLEIDPASS)
# and Hutch signs with the Developer ID and notarizes; nothing else changes.

on:
  push:
    tags: ["v*"]
  # A pull request that changes the packaging runs the same dry run, so a broken bundle is caught
  # before a tag. Until native/akou-capture is on the branch it builds without the helper and says so.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - electrobun.config.ts
      - package.json
      - bun.lock
      - scripts/build-app.ts
      - scripts/build-cli.ts
      - scripts/smoke-app.ts
      - scripts/smoke-cli.ts
      - scripts/stamp-version.ts
      - scripts/post-build.ts
      - scripts/post-wrap.ts
      - scripts/patch-plist.sh
  workflow_dispatch:
    inputs:
      allow_missing_helper:
        description: "Dry run only: build the app without native/akou-capture"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.2
  RUST_VERSION: 1.97.1

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: every version string equals the tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            bun scripts/stamp-version.ts --check --tag "$REF_NAME"
          else
            bun scripts/stamp-version.ts --check
          fi
      - run: bun run check

  app:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Empty until the owner adds them: then Hutch signs with the Developer ID and notarizes.
      ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
      ELECTROBUN_TEAMID: ${{ secrets.ELECTROBUN_TEAMID }}
      ELECTROBUN_APPLEID: ${{ secrets.ELECTROBUN_APPLEID }}
      ELECTROBUN_APPLEIDPASS: ${{ secrets.ELECTROBUN_APPLEIDPASS }}
      HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HELPER_FLAG: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.allow_missing_helper)) && '--allow-missing-helper' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: macOS arm64 only
        run: |
          test "$(uname -m)" = arm64 || { echo "the app is built on arm64; this runner is $(uname -m)"; exit 1; }
          sw_vers
      - name: the capture helper is in this tree
        run: |
          if [ ! -f native/akou-capture/Cargo.toml ]; then
            if [ -n "$HELPER_FLAG" ]; then
              echo "::warning::native/akou-capture is absent: this dry run builds the app WITHOUT the capture helper"
            else
              echo "::error::native/akou-capture is absent, so there is no capture helper to ship. Merge the helper (PR #6) before tagging."
              exit 1
            fi
          fi
      - name: Rust ${{ env.RUST_VERSION }}
        if: hashFiles('native/akou-capture/Cargo.toml') != ''
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          cargo --version
      - name: the Developer ID certificate, when the owner has added one
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        if: env.HAS_CERTIFICATE == 'true'
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass="$(openssl rand -hex 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Hutch and the ElectroBun runtime, cached by their pins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.hutch
          key: hutch-macos-arm64-electrobun-2.0.1-hutch-0.24.3
      - name: build the app (helper, pages, Workers, ElectroBun through Hutch)
        run: bun scripts/build-app.ts ${HELPER_FLAG:+"$HELPER_FLAG"}
      - name: check the built app without opening it
        run: bun scripts/smoke-app.ts ${HELPER_FLAG:+"$HELPER_FLAG"}
      - name: build the CLI (bun build --compile, ad-hoc codesign, --verify --strict)
        run: bun scripts/build-cli.ts
      - name: check the CLI binary headless
        run: bun scripts/smoke-cli.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-arm64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  cli:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: build the CLI (bun build --compile)
        run: bun scripts/build-cli.ts
      - name: check the CLI binary headless
        run: bun scripts/smoke-cli.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-cli-${{ runner.os }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [app, cli]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: publish the release (a prerelease while 0.x; never a draft)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          version="${TAG#v}"
          prerelease=""
          case "$version" in 0.*|*-*) prerelease="--prerelease" ;; esac
          cat > notes.md <<'EOF'
          **This build is not signed by Apple.** The first time you open akou, macOS refuses it: right-click akou in Applications and choose Open, or open it once, then go to System Settings, Privacy & Security and choose Open Anyway. After an update macOS may ask for the microphone and system audio again. The speech models are downloaded on first run. See [docs/install.md](https://github.com/GeiserX/akou/blob/main/docs/install.md).
          EOF
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "akou $version" \
            --notes-file notes.md \
            --generate-notes \
            ${prerelease:+"$prerelease"} \
            -- akou-* SHA256SUMS
