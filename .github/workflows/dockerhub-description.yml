name: Docker Hub Description

on:
  push:
    branches: [main]
    paths: [README.md]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: drumsergio/akou
          short-description: "akou's self-hosted transcription server: file jobs, signed webhooks, an OpenAI-compatible endpoint"
          # The README links its images and files by relative path; Docker Hub needs them absolute.
          enable-url-completion: true
