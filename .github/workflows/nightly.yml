name: nightly

# Once a day on main, and by hand (docs/CI-CD.md section 2.2). Nothing here is a required check,
# so a red night on main opens one standing issue, "nightly is red", or adds the night to it, and
# the next green night closes it (the `report` job at the end).
#
# - models-nightly: the real recognizer and the real diarizer on public, openly licensed audio,
#   through the app's own code, on every OS (docs/TESTING.md TS-19 and TS-20). WER per engine and
#   language on FLEURS, latency percentiles and the real-time factor, diarization error on two
#   AMI Meeting Corpus test meetings, and the replay recall floor, each next to its committed
#   baseline in docs/gates/nightly-baselines.json (scripts/eval/nightly.ts). Today it scores the
#   default recognizer, and Qwen3-ASR through llama-server on macOS and Linux (ASR-5: WER, silent
#   clips, and memory flat over 150 requests with the default prompt cache as the failing control).
#   Dictation's release-to-text time per engine (the streaming model, Qwen, a loopback akou serve)
#   for 3, 10 and 30 s of speech (docs/ux/DICTATION.md DC-T3), recorded and uploaded as this OS's
#   entry of docs/gates/dictation-latency.json. That committed table comes from a real machine,
#   since these runners have no GPU worth the name; the night's numbers sit beside it.
#   Dictation's biasing gate (docs/ux/DICTATION.md DC-L7) on the same Qwen: hits, false insertions,
#   WER and echo rate with the learned terms as context against none, with its positive control.
#   It decodes 90 clips four times (about two hours on the macOS runner, past this job's timeout
#   with the rest), so it runs by hand only (`only: biasing`); the committed result in
#   docs/gates/dictation-biasing.json comes from a real machine.
# - soak: one call through the app's call manager and the fake helper at 10x speed for one runner
#   hour, so ten hours of audio, checked for holes in the audio, memory growth, a held event loop
#   and an unreadable or swelling log (docs/TESTING.md TS-24, scripts/soak.ts).
# - clock-shift: the unit and e2e suites (`bun test`) once a year ahead and once each in two
#   unusual time zones (TS-5), so a fixture pinned to the calendar, or code that assumes the zone,
#   is red here before it turns a pull request red on its own a day later.
# - dictation-timing: DC-R6's wall-clock bound, a 20 s hold's release-to-text within 200 ms of a
#   3 s hold's over a slow link (`AKOU_TIMING=1`). The PR check counts the bytes sent after release
#   instead, since a shared runner's stall moved the wall clock by up to 1.8 s.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Stages to run, comma separated (fleurs, ami, replay, qwen, dictation, biasing); empty runs all but biasing"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  models-nightly:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The macOS leg took 128 minutes on a passing night, and on 2026-10-07 it reached the long unit
    # 15 minutes later than that night, so a night whose long requests run past 6 minutes needs more
    # than 150.
    timeout-minutes: 200
    env:
      CARGO_TERM_COLOR: always
      EXE: ${{ matrix.os == 'windows-latest' && '.exe' || '' }}
      MODEL_URL: https://huggingface.co/altunenes/parakeet-rs/resolve/4d2a8bc71f5c896ec40faa59732e6716295edaf2/nemotron-3-diarization/nemotron3_diar_v3.onnx
      MODEL_SHA256: 915e4fa23b0192ed9fadeb1cdd26847df986d50c92012d177be28d0343bbe03a
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: build akou-diarize
        working-directory: native/akou-diarize
        run: cargo build --locked --release
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The recognizer's files are checked against their pins in src/main/asr/models.ts on every
      # use, so a stale cache costs a download, never a wrong model.
      - name: the recognizer, cached by its pins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: eval-models
          key: recognizer-${{ runner.os }}-${{ hashFiles('src/main/asr/models.ts') }}
      - name: the Nemotron model, by its pinned SHA-256
        id: nemotron
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models/nemotron3_diar_v3.onnx
          key: nemotron3-diar-${{ env.MODEL_SHA256 }}
      - name: fetch the Nemotron model
        if: steps.nemotron.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fsSL -o models/nemotron3_diar_v3.onnx "$MODEL_URL"
      - name: the Nemotron model matches its pin
        run: |
          got=$( (sha256sum models/nemotron3_diar_v3.onnx 2>/dev/null || shasum -a 256 models/nemotron3_diar_v3.onnx) | cut -d' ' -f1)
          echo "sha256 $got"
          test "$got" = "$MODEL_SHA256"
      # The evaluation audio (about 290 MB), keyed by the script that pins it.
      - name: the evaluation audio, cached by its pins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: eval-data
          key: eval-data-${{ runner.os }}-${{ hashFiles('scripts/eval/nightly.ts', 'docs/research/asr-benchmark.json') }}
      # Qwen and its llama-server build (about 2.5 GB), and dictation's streaming model, are fetched
      # each night, outside the cached folders, so the recognizer's cache stays small enough for the
      # repository's cache quota.
      - name: evaluate against the committed baselines
        env:
          ONLY: ${{ inputs.only }}
          MACHINE: GitHub's ${{ matrix.os }} runner
        run: |
          bun scripts/eval/nightly.ts --models eval-models --data eval-data \
            --qwen-models "$RUNNER_TEMP/qwen-models" \
            --diarize "native/akou-diarize/target/release/akou-diarize$EXE" \
            --nemotron models/nemotron3_diar_v3.onnx ${ONLY:+--only "$ONLY"} --out nightly-results.json \
            --latency-table dictation-latency.json --machine "$MACHINE"
      - name: dictation's release-to-text table for this OS
        if: always() && hashFiles('dictation-latency.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dictation-latency-${{ matrix.os }}
          path: dictation-latency.json

  clock-shift:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every `bun` the run starts preloads the shift through BUN_OPTIONS, the app processes
          # the e2e tests spawn included; the clock keeps ticking from a year ahead.
          - run: a year ahead
            shift: true
            floor: clock-shift
          # UTC+14, the first to reach a new day, and UTC-2:30, a half-hour offset with DST.
          - run: Pacific/Kiritimati
            zone: Pacific/Kiritimati
            floor: check
          - run: America/St_Johns
            zone: America/St_Johns
            floor: check
    name: clock-shift (${{ matrix.run }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # ffmpeg as on check's Linux leg, so the same tests run and the same floor holds.
      - run: command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; }
      - name: bun test, ${{ matrix.run }}
        shell: bash
        env:
          SHIFT: ${{ matrix.shift && 'yes' || '' }}
          ZONE: ${{ matrix.zone }}
        run: |
          if [ -n "$SHIFT" ]; then export BUN_OPTIONS="--preload=$PWD/scripts/ci/shift-clock.ts"; fi
          if [ -n "$ZONE" ]; then export TZ="$ZONE"; fi
          bun -e 'console.log(`the clock reads ${new Date().toString()}`)'
          bun test --reporter=junit --reporter-outfile=.junit-check.xml
      # The same suite as check's Linux leg, so the zone runs take check's floor. The year-ahead run
      # takes clock-shift's: check's moved by the tests that compare a file's mtime with `Date.now()`
      # and skip a year ahead (CLOCK_SHIFTED); tests/ci-gates.test.ts holds the two together.
      - run: bun scripts/ci/test-floor.ts ${{ matrix.floor }} .junit-check.xml

  dictation-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AKOU_TIMING: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun test tests/dictation-remote.e2e.test.ts -t "after release"

  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun scripts/soak.ts --speed 10 --minutes 60

  # A red night on main opens the standing issue or comments on it; a green one closes it. Scheduled
  # nights and full dispatches only: a dispatch of a few stages, or on a branch, is someone's test.
  report:
    needs: [models-nightly, clock-shift, dictation-timing, soak]
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.only == '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: open, update or close the standing issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULTS: ${{ toJSON(needs) }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="nightly is red"
          red=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | "- \(.key): \(.value.result)"')
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$red" ]; then
            body=$(printf 'The nightly of %s failed:\n\n%s\n\n%s\n' "$(date -u +%F)" "$red" "$RUN")
            if [ -n "$open" ]; then gh issue comment "$open" --body "$body"
            else gh issue create --title "$title" --body "$body"; fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Green again: $RUN"
          fi
          echo "red: ${red:-none}; issue: ${open:-none open before this run}"
